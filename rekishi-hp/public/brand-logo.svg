  <text x="205" y="109" fill="url(#ink)" font-family="Cinzel, 'Times New Roman', serif" font-size="82" font-weight="600" letter-spacing="4">CONCEPT PRINCIPAL</text>

  <g transform="translate(204 135)">
    <line x1="0" y1="0" x2="397" y2="0" stroke="url(#line)" stroke-width="1.4"/>
    <line x1="435" y1="0" x2="540" y2="0" stroke="url(#line)" stroke-width="1.4"/>
    <path d="M416-18c5 14 11 20 25 25-14 5-20 11-25 25-5-14-11-20-25-25 14-5 20-11 25-25Z" fill="#b36f38"/>
  </g>

  <text x="762" y="145" fill="#6b3a18" font-family="'Noto Serif JP', 'Yu Mincho', serif" font-size="25" letter-spacing="5">授業と読書をつなぐ知のアーカイブ</text>
