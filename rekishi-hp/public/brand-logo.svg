<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1214 169" role="img" aria-labelledby="title desc">
  <title id="title">Concept Principal</title>
  <desc id="desc">授業と読書をつなぐ知のアーカイブ</desc>
  <defs>
    <radialGradient id="paper" cx="52%" cy="48%" r="85%">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="0.62" stop-color="#fbf5ee"/>
      <stop offset="1" stop-color="#f2e6d8"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ce8c52"/>
      <stop offset="0.14" stop-color="#1b0902"/>
      <stop offset="0.33" stop-color="#6f3816"/>
      <stop offset="0.54" stop-color="#120704"/>
      <stop offset="0.74" stop-color="#b56f36"/>
      <stop offset="1" stop-color="#230d05"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d89b5c"/>
      <stop offset="0.45" stop-color="#743812"/>
      <stop offset="0.7" stop-color="#f1bd83"/>
      <stop offset="1" stop-color="#5a270e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#caa27b" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#9a5d2c"/>
      <stop offset="1" stop-color="#caa27b" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6f3b1c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1214" height="169" fill="url(#paper)"/>

  <g transform="translate(84 83)" filter="url(#soft)">
    <circle r="76" fill="none" stroke="url(#bronze)" stroke-width="8"/>
    <circle r="54" fill="none" stroke="#d8b084" stroke-width="1" opacity="0.55"/>
    <g fill="url(#bronze)">
      <path d="M0-73 13-13 0 0-13-13Z"/>
      <path d="M0 73 13 13 0 0-13 13Z"/>
      <path d="M-73 0-13-13 0 0-13 13Z"/>
      <path d="M73 0 13-13 0 0 13 13Z"/>
      <path d="M0-46 9-9 0 0-9-9Z" transform="rotate(45)" opacity="0.55"/>
      <path d="M0-46 9-9 0 0-9-9Z" transform="rotate(135)" opacity="0.55"/>
      <path d="M0-46 9-9 0 0-9-9Z" transform="rotate(225)" opacity="0.55"/>
      <path d="M0-46 9-9 0 0-9-9Z" transform="rotate(315)" opacity="0.55"/>
