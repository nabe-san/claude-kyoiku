<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歴史シミュレーション — シナリオ選択</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #ede4cc;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(150,110,40,.032) 38px, rgba(150,110,40,.032) 39px),
    radial-gradient(ellipse 120% 50% at 50% -5%, rgba(200,168,75,.12) 0%, transparent 100%);
  color: #1e1208;
  font-family: '游明朝','YuMincho','Hiragino Mincho ProN','Georgia',serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px 80px;
}

.site-header {
  text-align: center;
  padding: 50px 0 30px;
  width: 100%;
  max-width: 900px;
  border-bottom: 1px solid #c8a84b44;
  margin-bottom: 40px;
}
.site-deco { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 18px; }
.site-deco-line { flex: 1; max-width: 100px; height: 1px; }
.site-deco-line:first-child { background: linear-gradient(90deg, transparent, #c8a84b); }
.site-deco-line:last-child  { background: linear-gradient(90deg, #c8a84b, transparent); }
.site-kamon { font-size: 22px; color: #8b2020; opacity: .8; }
.site-title { font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #1e1208; margin-bottom: 8px; }
.site-subtitle { font-size: 12px; color: #907850; letter-spacing: 5px; }

.section-label {
  width: 100%; max-width: 900px;
  font-size: 11px; color: #907850; letter-spacing: 4px;
  padding-bottom: 10px; margin-bottom: 20px;
  border-bottom: 1px solid #c8a84b33;
}

.scenarios-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  width: 100%;
  max-width: 900px;
}

.scenario-card {
  background: #faf6ec;
  border: 1px solid #c8a84b55;
  border-radius: 4px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 3px 14px rgba(42,26,10,.1);
  transition: transform .2s, box-shadow .2s, border-color .2s;
  display: block;
}
.scenario-card[href]:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(42,26,10,.18);
  border-color: #c8a84b;
}
.scenario-card.coming-soon {
  opacity: .55;
  cursor: default;
}

.card-portrait {
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-portrait img {
  height: 150px;
  width: auto;
  max-width: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
}
.card-portrait-sil {
  height: 160px;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4px;
}
.card-portrait-sil svg { height: 120px; width: auto; opacity: .5; }

.card-meta {
  display: flex;
  padding: 14px 16px 0;
  gap: 8px;
  flex-wrap: wrap;
}
.card-tag {
  font-size: 10px; letter-spacing: 1px; padding: 3px 10px;
  background: #8b2020; color: #faf6ec; border-radius: 2px;
}
.card-era { font-size: 11px; color: #907850; display: flex; align-items: center; }

.card-body { padding: 12px 16px 20px; }
.card-title { font-size: 18px; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; color: #1e1208; line-height: 1.5; }
.card-concept {
  font-size: 11px; color: #6a4828; letter-spacing: 1px; margin-bottom: 8px;
  padding: 6px 10px; background: #f5e8c8; border-radius: 2px; border-left: 2px solid #c8a84b;
  line-height: 1.6;
}
.card-question {
  font-size: 12px; color: #8b2020; line-height: 1.75;
  padding: 0 0 8px; margin-bottom: 8px; border-bottom: 1px solid #c8a84b33;
}
.card-desc { font-size: 12px; color: #5a3a18; line-height: 1.8; }

.card-coming {
  display: flex; align-items: center; justify-content: center;
  height: 42px; font-size: 13px; color: #c8a84b88; letter-spacing: 3px;
  border-top: 1px solid #c8a84b33;
}

.loading, .error {
  width: 100%;
  max-width: 900px;
  background: #faf6ec;
  border: 1px solid #c8a84b55;
  border-radius: 4px;
  padding: 22px 24px;
  color: #5a3a18;
  font-size: 14px;
  line-height: 1.9;
}
.error strong { color: #8b2020; }
.error code {
  background: #f5e8c8;
  padding: 2px 6px;
  border-radius: 2px;
  font-family: Consolas, monospace;
  font-size: 13px;
}

.site-footer {
  text-align: center; padding: 40px 0 0;
  font-size: 10px; color: #a09070; letter-spacing: 2px;
  width: 100%; max-width: 900px;
  border-top: 1px solid #c8a84b22;
  margin-top: 40px;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-deco">
    <div class="site-deco-line"></div>
    <div class="site-kamon">✦</div>
    <div class="site-deco-line"></div>
  </div>
  <h1 class="site-title">歴史シミュレーション</h1>
  <div class="site-subtitle">歴史の分岐点を追体験する</div>
</header>

<div class="section-label">── シナリオ一覧 ──</div>
<div id="scenariosGrid" class="scenarios-grid">
  <div class="loading">シナリオ一覧を読み込んでいます。</div>
</div>

<footer class="site-footer">
  歴史シミュレーション v2 — 授業用ビジュアルノベル型学習ツール
</footer>

<script>
const SILHOUETTE_SVG = `
<svg viewBox="0 0 80 185" xmlns="http://www.w3.org/2000/svg">
  <rect x="22" y="2" width="36" height="26" rx="3" fill="#c8a84b" opacity=".5"/>
  <ellipse cx="40" cy="60" rx="19" ry="21" fill="#c8a84b" opacity=".5"/>
  <path d="M6 185 L6 106 Q6 94 24 89 L40 85 L56 89 Q74 94 74 106 L74 185Z" fill="#c8a84b" opacity=".5"/>
</svg>`;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
}

function encodeDataPath(path) {
  return path.split('/').map(part => encodeURIComponent(part)).join('/');
}

function portraitHtml(scenario) {
  const bg = scenario.bg || 'linear-gradient(180deg,#8a7a5a 0%,#5a4a30 100%)';
  if (scenario.image) {
    return `<div class="card-portrait" style="background:${bg};"><img src="${escapeHtml(scenario.image)}" alt="${escapeHtml(scenario.title)}"></div>`;
  }
  return `<div class="card-portrait" style="background:${bg};"><div class="card-portrait-sil">${SILHOUETTE_SVG}</div></div>`;
}

function cardHtml(scenario) {
  const isReady = scenario.status !== 'coming-soon';
  const href = isReady
    ? scenario.url || `player.html?data=${encodeDataPath(scenario.data)}`
    : '';
  const tag = scenario.tag || scenario.subject || '歴史総合';
  const question = scenario.bigQuestion
    ? `<div class="card-question">問い：${escapeHtml(scenario.bigQuestion)}</div>`
    : '';
  const coming = isReady ? '' : '<div class="card-coming">準備中</div>';
  const open = isReady ? `<a href="${href}" class="scenario-card">` : '<div class="scenario-card coming-soon">';
  const close = isReady ? '</a>' : '</div>';
  return `${open}
    ${portraitHtml(scenario)}
    <div class="card-meta">
      <span class="card-tag">${escapeHtml(tag)}</span>
      <span class="card-era">${escapeHtml(scenario.era || '')}</span>
    </div>
    <div class="card-body">
      <div class="card-title">${escapeHtml(scenario.title)}</div>
      <div class="card-concept">${escapeHtml(scenario.concept || '')}</div>
      ${question}
      <div class="card-desc">${escapeHtml(scenario.description || '')}</div>
    </div>
    ${coming}
  ${close}`;
}

async function loadScenarios() {
  const grid = document.getElementById('scenariosGrid');
  try {
    const response = await fetch('scenarios.json', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    const scenarios = data.scenarios || [];
    grid.innerHTML = scenarios.map(cardHtml).join('');
  } catch (error) {
    const isFile = location.protocol === 'file:';
    const message = isFile
      ? `この画面は壊れていません。JSONを読み込む方式のため、ダブルクリックではなくローカルサーバー経由で開いてください。<br><br>PowerShellで <code>歴史シミュレーションv2</code> フォルダに移動して、<code>python -m http.server 8001</code> を実行します。<br>そのあと <code>http://localhost:8001/index.html</code> を開いてください。`
      : `JSON化したトップ画面はローカルサーバー経由で開いてください。<br>例：<code>python -m http.server 8001</code>`;
    grid.className = '';
    grid.innerHTML = `<div class="error"><strong>scenarios.json を読み込めませんでした。</strong><br>${message}<br><br>詳細：${escapeHtml(error.message)}</div>`;
  }
}

loadScenarios();
</script>
</body>
</html>
