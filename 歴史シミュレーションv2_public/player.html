<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歴史シミュレーション — プレイヤー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #ede4cc;
  color: #1e1208;
  font-family: 'Yu Mincho','YuMincho','Hiragino Mincho ProN','Georgia',serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
#app { width: min(920px, 100%); min-height: 100vh; padding: 0 20px 80px; }
.page-enter { animation: pageIn .25s ease both; }
@keyframes pageIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.game-header { text-align: center; padding: 22px 0 18px; border-bottom: 1px solid #c8a84b44; margin-bottom: 22px; }
.game-label { font-size: 12px; color: #907850; letter-spacing: 4px; }
.back-link { display: inline-block; margin-bottom: 10px; color: #8b2020; text-decoration: none; font-size: 12px; letter-spacing: 2px; }
.back-link:hover { text-decoration: underline; }
.timeline { display: flex; justify-content: space-between; padding: 12px 0 4px; margin-top: 14px; font-size: 12px; gap: 4px; }
.tl-item { flex: 1; text-align: center; color: #a09060; white-space: nowrap; padding: 6px 2px; border-bottom: 2px solid #c8c080; }
.tl-item.past { color: #604020; border-color: #907040; }
.tl-item.active { color: #8b2020; border-color: #8b2020; font-weight: bold; }
.scene-header { display: grid; grid-template-columns: max-content 1fr; overflow: hidden; margin-bottom: 18px; box-shadow: 0 4px 16px rgba(42,26,10,.18); border-radius: 3px; }
.scene-year { background: #c8a84b; color: #1a0800; padding: 0 22px; font-size: 17px; font-weight: bold; display: flex; align-items: center; min-width: 150px; justify-content: center; }
.scene-title { background: #2a1a0a; color: #f0e6d0; font-size: 23px; font-weight: bold; padding: 18px 26px; }
.vn-scene { border: 1px solid #c8a84b44; border-radius: 4px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 4px 24px rgba(42,26,10,.16); }
.vn-stage { height: 390px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.vn-stage::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 60% at 50% 30%, rgba(255,240,200,.12), transparent 65%), linear-gradient(0deg, rgba(0,0,0,.20), transparent 42%); }
.title-stage { height: 340px; }
.vn-char { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; }
.char-photo { width: auto; height: 310px; max-width: min(360px, 82vw); object-fit: cover; object-position: top center; border-radius: 4px; filter: drop-shadow(0 8px 28px rgba(0,0,0,.45)); }
.title-stage .char-photo { height: 270px; max-width: min(380px, 82vw); }
.char-silhouette { height: 260px; width: 130px; display: flex; align-items: center; justify-content: center; opacity: .62; }
.char-silhouette svg { width: 120px; height: 260px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
.vn-box { background: linear-gradient(180deg, #f5ead2 0%, #ecddc0 60%, #e6d6ae 100%); padding: 0 30px 26px; min-height: 146px; position: relative; cursor: pointer; }
.vn-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, #c8a84b, #8b2020, #c8a84b, transparent); }
.vn-name { display: inline-block; font-size: 15px; font-weight: bold; padding: 10px 34px 10px 18px; margin-bottom: 14px; background: #1e1208; color: #f0e6d0; border-left: 3px solid #c8a84b; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 100%, 0 100%); }
.vn-name.hidden { display: none; }
.vn-name-role { font-size: 11px; opacity: .7; margin-left: 6px; font-weight: normal; }
.vn-text { font-size: 19px; line-height: 2; min-height: 72px; }
.vn-arrow { margin-top: 8px; font-size: 18px; color: #8b2020; }
.vn-status-overlay { position: relative; z-index: 2; width: 100%; height: 100%; display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: center; padding: 34px 44px; background: linear-gradient(135deg, rgba(14,8,2,.88), rgba(20,10,4,.82)); }
.vn-status-overlay .char-silhouette { justify-self: center; height: 250px; opacity: .55; }
.vso-content { min-width: 0; }
.vso-title { font-size: 14px; color: #c8a84b; letter-spacing: 4px; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid #c8a84b55; text-align: center; }
.vso-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
.vso-item { font-size: 17px; color: #e0d0b0; line-height: 1.8; }
.continue-btn, .start-btn, .restart-btn { display: block; width: 100%; background: #2a1a0a; border: 1px solid #c8a84b; color: #c8a84b; padding: 14px; font-family: inherit; font-size: 14px; cursor: pointer; letter-spacing: 3px; border-radius: 3px; margin-bottom: 28px; }
.continue-btn.hidden-btn { opacity: 0; pointer-events: none; }
.title-content { text-align: center; padding: 46px 20px 20px; }
.title-main { font-size: 34px; line-height: 1.4; margin-bottom: 10px; color: #1e1208; }
.title-sub { font-size: 13px; color: #907850; letter-spacing: 5px; margin-bottom: 24px; }
.title-desc, .decision-context, .narration, .concept-intro { background: #faf6ec; border: 1px solid #c8a84b44; padding: 22px 28px; line-height: 1.95; border-radius: 3px; text-align: left; }
.title-desc { max-width: 760px; margin: 0 auto 18px; font-size: 17px; }
.scenario-points { max-width: 760px; margin: 0 auto 18px; background: #faf6ec; border: 1px solid #c8a84b44; border-left: 5px solid #c8a84b; padding: 20px 26px; text-align: left; line-height: 1.85; border-radius: 3px; }
.scenario-points-title { font-size: 11px; color: #8b2020; letter-spacing: 2px; margin-bottom: 10px; }
.scenario-points ul { margin-left: 1.2em; }
.scenario-points li { margin-bottom: 7px; }
.scenario-points li:last-child { margin-bottom: 0; }
.big-question { max-width: 760px; margin: 0 auto 18px; background: #fff8e6; border: 1px solid #c8a84b66; border-left: 5px solid #8b2020; padding: 18px 24px; text-align: left; line-height: 1.8; }
.big-question-label { font-size: 12px; color: #8b2020; letter-spacing: 2px; margin-bottom: 6px; }
.big-question-text { font-size: 17px; color: #1e1208; }
.title-note { max-width: 760px; margin: 0 auto 32px; font-size: 11px; color: #907850; line-height: 2; text-align: left; }
.image-note { background: #f3ead0; border-top: 1px solid #c8a84b33; padding: 6px 10px; font-size: 10px; color: #9a8358; letter-spacing: 1px; text-align: center; }
.decision-tag, .ending-section-title { display: inline-block; background: #8b2020; color: #faf6ec; padding: 5px 14px; font-size: 12px; letter-spacing: 2px; border-radius: 2px; margin-bottom: 14px; }
.decision-context { margin-bottom: 18px; border-left: 5px solid #c8a84b; }
.choices { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.choice-btn { background: #faf6ec; border: 1px solid #c8a84b88; color: #1e1208; padding: 16px 20px 16px 58px; text-align: left; cursor: pointer; font-family: inherit; font-size: 17px; line-height: 1.75; border-radius: 3px; position: relative; }
.choice-btn::before { content: attr(data-label); position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; color: #faf6ec; background: #8b2020; line-height: 30px; text-align: center; font-weight: bold; }
.keyboard-hint { text-align: center; font-size: 12px; color: #907850; letter-spacing: 2px; margin-bottom: 20px; }
.timer-area { background: #f5e8c8; border: 1px solid #c8a84b66; padding: 12px 18px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; justify-content: center; color: #5a3a18; }
.timer-count { font-size: 22px; color: #8b2020; min-width: 70px; text-align: center; font-weight: bold; }
.result-your { background: #f0f4f8; border: 1px solid #b0c4de; border-radius: 3px; padding: 14px 20px; margin-bottom: 12px; }
.result-your-label { font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; color: #4a6090; }
.result-your-text { font-size: 17px; color: #2a3850; line-height: 1.7; margin-bottom: 8px; font-weight: bold; }
.result-consequence { font-size: 15px; color: #3a4060; line-height: 1.85; }
.match-banner { display: flex; align-items: center; gap: 14px; padding: 14px 24px; margin-bottom: 20px; border-radius: 3px; font-size: 17px; font-weight: bold; letter-spacing: 1px; }
.match-banner.match { background: #e4f5ea; color: #1a5a28; border: 1px solid #3a9048; }
.match-banner.mismatch { background: #fdf5e2; color: #6a4010; border: 1px solid #c09030; }
.match-icon { font-size: 22px; }
.result-historical { border-radius: 4px; overflow: hidden; margin-bottom: 22px; box-shadow: 0 6px 28px rgba(30,100,50,.15); border: 2px solid #1a7030; }
.result-historical-header { background: linear-gradient(135deg, #1a5a28 0%, #2a8040 100%); padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
.result-historical-tag { font-size: 10px; color: #a0f0c0; letter-spacing: 2px; border: 1px solid #a0f0c055; padding: 3px 10px; border-radius: 2px; flex-shrink: 0; }
.result-historical-title { font-size: 15px; color: #e8fff2; font-weight: bold; letter-spacing: 1px; }
.result-historical-choice { font-size: 20px; font-weight: bold; color: #1a3020; padding: 22px 28px 16px; border-bottom: 1px solid #a0d8b0; line-height: 1.6; background: #f4fdf6; }
.result-historical-choice::before { content: '「'; }
.result-historical-choice::after { content: '」'; }
.result-historical-why { font-size: 11px; color: #3a7850; letter-spacing: 2px; padding: 16px 28px 4px; background: #f4fdf6; }
.result-historical-body { font-size: 15px; line-height: 2; color: #1a2a1a; padding: 6px 28px 24px; background: #f4fdf6; }
.result-historical-body p { margin-bottom: .8em; }
.result-historical-body p:last-child { margin-bottom: 0; }
.result-historical-sub { color: #4a7855; font-size: 14px; }
.ending-section { margin-bottom: 28px; }
.ending-section-title { background: transparent; color: #8b2020; padding: 0 0 8px; border-bottom: 1px solid #8b202044; border-radius: 0; display: block; }
.narration { font-size: 18px; line-height: 2.15; }
.narration p { margin-bottom: 1em; }
.narration p:last-child { margin-bottom: 0; }
.emphasis { color: #8b2020; font-weight: bold; }
.score-display { padding: 28px 32px; margin-bottom: 20px; background: #faf6ec; border: 1px solid #c8a84b55; border-radius: 3px; display: grid; grid-template-columns: auto 1fr; gap: 0 28px; align-items: center; }
.score-num-wrap { text-align: center; }
.score-num { font-size: 56px; color: #8b2020; font-weight: bold; }
.score-denom { font-size: 28px; color: #907850; }
.score-label { font-size: 12px; color: #907850; margin-top: 4px; }
.score-text { font-size: 16px; line-height: 1.9; }
.choice-record { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e0d0a8; font-size: 13px; }
.choice-record:last-child { border-bottom: none; }
.record-badge { flex-shrink: 0; font-size: 11px; padding: 2px 10px; border-radius: 2px; margin-top: 2px; }
.record-badge.match { background: #ecf8ef; color: #1a6030; border: 1px solid #40a050; }
.record-badge.mismatch { background: #fdf6e4; color: #704810; border: 1px solid #c09040; }
.record-decision { font-size: 12px; color: #907850; margin-bottom: 3px; }
.record-text { line-height: 1.7; }
.learning-points { background: #fff8e6; border: 1px solid #c8a84b66; border-left: 5px solid #8b2020; border-radius: 3px; padding: 20px 26px; margin-bottom: 20px; }
.learning-points ol { margin-left: 1.4em; line-height: 1.9; }
.learning-points li { padding-left: .2em; margin-bottom: 8px; color: #1e1208; font-size: 16px; }
.concept-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.concept-card { background: #faf6ec; border: 1px solid #c8a84b55; border-top: 4px solid #8b2020; border-radius: 3px; padding: 22px 24px; box-shadow: 0 3px 14px rgba(42,26,10,.09); }
.concept-card:nth-child(2) { border-top-color: #1a6030; }
.concept-card:nth-child(3) { border-top-color: #1a3060; }
.concept-card:nth-child(4) { border-top-color: #7a5010; }
.concept-tag { font-size: 10px; letter-spacing: 2px; color: #8b2020; margin-bottom: 8px; }
.concept-card:nth-child(2) .concept-tag { color: #1a6030; }
.concept-card:nth-child(3) .concept-tag { color: #1a3060; }
.concept-card:nth-child(4) .concept-tag { color: #7a5010; }
.concept-title { font-size: 18px; font-weight: bold; color: #1e1208; margin-bottom: 12px; line-height: 1.4; }
.concept-body { font-size: 14px; color: #3a2a10; line-height: 1.9; }
.error { margin-top: 40px; background: #fff8e6; border: 1px solid #c09030; padding: 24px; line-height: 1.9; border-radius: 4px; }
.error code { background: #f5e8c8; padding: 2px 6px; border-radius: 2px; font-family: Consolas, monospace; font-size: 13px; }
@media (max-width: 700px) {
  #app { padding: 0 12px 60px; }
  .timeline { font-size: 10px; }
  .scene-header { grid-template-columns: 1fr; }
  .scene-year { min-height: 48px; }
  .vn-stage { height: 330px; }
  .title-stage { height: 300px; }
  .char-photo { height: 260px; }
  .title-stage .char-photo { height: 230px; }
  .vn-status-overlay { grid-template-columns: 1fr; gap: 12px; padding: 24px; }
  .vn-status-overlay .char-silhouette { display: none; }
  .vso-grid, .concept-grid { grid-template-columns: 1fr; }
  .score-display { grid-template-columns: 1fr; text-align: center; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SILHOUETTE_SVG = '<svg viewBox="0 0 80 185" xmlns="http://www.w3.org/2000/svg"><ellipse cx="40" cy="58" rx="18" ry="22" fill="#c8a84b"/><path d="M8 185 L8 108 Q8 94 25 89 L40 84 L55 89 Q72 94 72 108 L72 185Z" fill="#c8a84b"/></svg>';

let SCENARIO, CHARS, P, TL, META, ENDING;
let S = { passage: 'title', lineIdx: 0, showResult: false, pendingChoice: null, matches: 0, log: [] };
let timerInterval = null;
let timerRemaining = 60;
let timerRunning = false;

async function loadScenario() {
  try {
    const params = new URLSearchParams(location.search);
    const scenarioPath = params.get('data') || 'scenarios/_json_template/scenario.json';
    const response = await fetch(scenarioPath, { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    SCENARIO = await response.json();
    META = SCENARIO.meta || {};
    CHARS = SCENARIO.characters || {};
    P = SCENARIO.passages || {};
    TL = SCENARIO.timeline || [];
    ENDING = SCENARIO.ending || {};
    timerRemaining = META.timerSeconds || 60;
    document.title = META.title || '歴史シミュレーション';
    render();
  } catch (error) {
    const isFile = location.protocol === 'file:';
    const message = isFile
      ? `JSON版プレイヤーは、ローカルサーバー経由で開いてください。<br><br>例：PowerShellで <code>歴史シミュレーションv2</code> フォルダに移動し、<code>python -m http.server 8001</code> を実行します。`
      : `scenario.json を読み込めませんでした。`;
    document.getElementById('app').innerHTML = `<div class="error"><strong>scenario.json を読み込めませんでした。</strong><br>${message}<br><br>詳細: ${escapeHtml(error.message)}</div>`;
  }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function tlHtml() {
  return `<div class="timeline">${TL.map((t, i) => `<div class="tl-item ${i < (P[S.passage]?.tl || 0) ? 'past' : ''} ${i === (P[S.passage]?.tl || 0) ? 'active' : ''}">${escapeHtml(t).replace(/\n/g,'<br>')}</div>`).join('')}</div>`;
}

function renderHeader() {
  return `<div class="game-header page-enter"><a class="back-link" href="index.html">← シナリオ一覧へ戻る</a><div class="game-label">${escapeHtml(META.subject || '歴史総合')} — 歴史シミュレーション</div>${tlHtml()}</div>`;
}

function buildChar(charKey) {
  const c = charKey && CHARS[charKey];
  if (!c) return `<div class="vn-char"><div class="char-silhouette">${SILHOUETTE_SVG}</div></div>`;
  if (c.photo) return `<div class="vn-char"><img class="char-photo" src="${escapeHtml(c.photo)}" alt="${escapeHtml(c.name)}"></div>`;
  return `<div class="vn-char"><div class="char-silhouette">${SILHOUETTE_SVG}</div></div>`;
}

function getStageBg(charKey) {
  const c = charKey && CHARS[charKey];
  return (c && c.bg) ? c.bg : 'linear-gradient(180deg,#8a7a5a 0%,#5a4a30 100%)';
}

function render() {
  const passage = P[S.passage];
  if (!passage || passage.type === 'title') return renderTitle();
  if (passage.type === 'story') return renderStory(passage);
  if (passage.type === 'decision') return S.showResult ? renderResult(passage) : renderDecision(passage);
  if (passage.type === 'ending') return renderEnding();
}

function renderTitle() {
  const c = CHARS.protagonist || {};
  const hero = c.photo ? `<img class="char-photo" src="${escapeHtml(c.photo)}" alt="${escapeHtml(c.name)}">` : `<div class="char-silhouette">${SILHOUETTE_SVG}</div>`;
  const imageNoteHtml = META.imageNote ? `<div class="image-note">${escapeHtml(META.imageNote)}</div>` : '';
  const scenarioPoints = META.scenarioPoints || [];
  const scenarioPointsHtml = scenarioPoints.length ? `<div class="scenario-points"><div class="scenario-points-title">シナリオの要点</div><ul>${scenarioPoints.map(point => `<li>${escapeHtml(point)}</li>`).join('')}</ul></div>` : '';
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="vn-scene page-enter"><div class="vn-stage title-stage" style="background:${c.bg || getStageBg('protagonist')}"><div class="vn-char">${hero}</div></div>${imageNoteHtml}</div>
    <div class="title-content page-enter">
      <h1 class="title-main">${META.titleHtml || escapeHtml(META.title || '')}</h1>
      <div class="title-sub">${escapeHtml(META.subtitle || '歴史の分岐点を追体験する')}</div>
      ${META.bigQuestion ? `<div class="big-question"><div class="big-question-label">大きな問い</div><div class="big-question-text">${escapeHtml(META.bigQuestion)}</div></div>` : ''}
      <div class="title-desc">${META.description || ''}</div>
      ${scenarioPointsHtml}
      <div class="title-note">${META.note || ''}</div>
      <button class="start-btn" onclick="goNext('${META.start || 'intro'}')">シミュレーション開始</button>
    </div>`;
}

function renderStory(passage) {
  const line = (passage.lines || [])[S.lineIdx] || {};
  const isLast = S.lineIdx >= (passage.lines || []).length - 1;
  const isStatus = line.type === 'status';
  const speakerKey = isStatus ? null : line.speaker;
  const displayKey = (!isStatus && !speakerKey) ? 'protagonist' : speakerKey;
  let stageInner = buildChar(displayKey);
  let boxContent = '';
  let stageBg = getStageBg(displayKey);
  if (isStatus) {
    stageBg = 'linear-gradient(135deg,rgba(14,8,2,.93),rgba(20,10,4,.91))';
    const items = (line.items || []).map(item => `<div class="vso-item">${escapeHtml(item)}</div>`).join('');
    stageInner = `<div class="vn-status-overlay"><div class="char-silhouette">${SILHOUETTE_SVG}</div><div class="vso-content"><div class="vso-title">── ${escapeHtml(line.title || '状況')} ──</div><div class="vso-grid">${items}</div></div></div>`;
  } else {
    const c = speakerKey && CHARS[speakerKey];
    const name = c ? `<div class="vn-name">${escapeHtml(c.name)}<span class="vn-name-role">${escapeHtml(c.role || '')}</span></div>` : '<div class="vn-name hidden"></div>';
    boxContent = `${name}<div class="vn-text">${line.text || ''}</div><div class="vn-arrow">${isLast ? '▼' : '▶'}</div>`;
  }
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="scene-header page-enter"><div class="scene-year">${escapeHtml(passage.year || '')}</div><div class="scene-title">${escapeHtml(passage.title || '')}</div></div>
    <div class="vn-scene page-enter" onclick="advanceLine()">
      <div class="vn-stage" style="background:${stageBg}">${stageInner}</div>
      ${isStatus ? '' : `<div class="vn-box">${boxContent}</div>`}
    </div>
    <button class="continue-btn${isLast ? '' : ' hidden-btn'}" onclick="goNext('${passage.next || ''}')">次のシーンへ</button>`;
}

function advanceLine() {
  const passage = P[S.passage];
  if (!passage || passage.type !== 'story') return;
  if (S.lineIdx < (passage.lines || []).length - 1) {
    S.lineIdx++;
    renderStory(passage);
  }
}

function renderDecision(passage) {
  const choicesHtml = (passage.choices || []).map((ch, i) => `<button class="choice-btn" data-label="${['A','B','C','D'][i] || i + 1}" onclick="choose(${i})">${ch.text}</button>`).join('');
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="scene-header page-enter"><div class="scene-year">${escapeHtml(passage.year || '')}</div><div class="scene-title">${escapeHtml(passage.title || '')}</div></div>
    <div class="vn-scene page-enter"><div class="vn-stage" style="background:${getStageBg('protagonist')}">${buildChar('protagonist')}</div></div>
    <div class="page-enter">
      <div class="timer-area"><div class="timer-count" id="timerCount">--</div><div>グループで審議してください</div><button class="restart-btn" style="width:auto;margin:0;padding:8px 12px;" onclick="resetTimer()">リセット</button></div>
      <div class="decision-tag">${escapeHtml(passage.tag || '決断')}</div>
      <div class="decision-context">${passage.context || ''}</div>
      <div class="choices">${choicesHtml}</div>
      <div class="keyboard-hint">A/B/C または 1/2/3 キーでも選択できます</div>
    </div>`;
  startTimer();
}

function getChoiceHistorical(ch) {
  return Boolean(ch && (ch.isHistorical || ch.historical));
}

function choose(index) {
  const passage = P[S.passage];
  const ch = (passage.choices || [])[index];
  if (!ch) return;
  clearInterval(timerInterval);
  timerRunning = false;
  if (getChoiceHistorical(ch)) S.matches++;
  S.log.push({ tag: passage.tag || '決断', text: ch.text, isMatch: getChoiceHistorical(ch) });
  S.pendingChoice = ch;
  S.showResult = true;
  renderResult(passage);
}

function renderResult(passage) {
  const ch = S.pendingChoice;
  const historicalChoice = (passage.choices || []).find(getChoiceHistorical);
  const isMatch = getChoiceHistorical(ch);
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="scene-header page-enter"><div class="scene-year">${escapeHtml(passage.year || '')}</div><div class="scene-title">${escapeHtml(passage.title || '')}</div></div>
    <div class="page-enter">
      <div class="result-your">
        <div class="result-your-label">── あなたの選択 ──</div>
        <div class="result-your-text">${ch.text}</div>
        <div class="result-consequence">${ch.playerConsequence || ch.pc || ''}</div>
      </div>
      <div class="match-banner ${isMatch ? 'match' : 'mismatch'}">
        <span class="match-icon">${isMatch ? '◎' : '△'}</span>
        <span>${isMatch ? '史実と一致' : '史実とは異なる判断'}</span>
      </div>
      <div class="result-historical">
        <div class="result-historical-header">
          <span class="result-historical-tag">史実の判断</span>
          <span class="result-historical-title">${escapeHtml((CHARS.protagonist || {}).name || '主人公')}が実際に選んだこと</span>
        </div>
        <div class="result-historical-choice">${historicalChoice ? historicalChoice.text : ''}</div>
        <div class="result-historical-why">── なぜその判断をしたのか ──</div>
        <div class="result-historical-body">${ch.historicalText || ch.ht || ''}</div>
      </div>
      <button class="continue-btn" onclick="goNextFromResult()">次のシーンへ</button>
    </div>`;
}

function goNextFromResult() {
  const next = S.pendingChoice && S.pendingChoice.next;
  S.pendingChoice = null;
  S.showResult = false;
  goNext(next);
}

function renderEnding() {
  const total = Object.values(P).filter(p => p.type === 'decision').length;
  const score = S.matches;
  const evals = ENDING.scoreEvaluations || {};
  const evalText = score === total ? evals.perfect : score >= Math.ceil(total / 2) ? evals.good : evals.low;
  const log = S.log.map(r => `<div class="choice-record"><span class="record-badge ${r.isMatch ? 'match' : 'mismatch'}">${r.isMatch ? '一致' : '相違'}</span><div><div class="record-decision">${escapeHtml(r.tag)}</div><div class="record-text">${r.text}</div></div></div>`).join('');
  const learningPoints = ENDING.learningPoints || [];
  const learningHtml = learningPoints.length ? `<div class="ending-section page-enter"><div class="ending-section-title">── このシミュレーションで学ぶこと ──</div><div class="learning-points"><ol>${learningPoints.map(point => `<li>${escapeHtml(point)}</li>`).join('')}</ol></div></div>` : '';
  const cards = (ENDING.conceptCards || []).map(card => `<div class="concept-card"><div class="concept-tag">${escapeHtml(card.tag)}</div><div class="concept-title">${escapeHtml(card.title)}</div><div class="concept-body">${card.body}</div></div>`).join('');
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <div class="ending-section page-enter"><div class="ending-section-title">── エピローグ ──</div><div class="narration">${ENDING.narration || ''}</div></div>
    <div class="ending-section page-enter">
      <div class="ending-section-title">── 選択記録 ──</div>
      <div class="score-display">
        <div class="score-num-wrap"><div><span class="score-num">${score}</span><span class="score-denom"> / ${total}</span></div><div class="score-label">史実と一致した判断</div></div>
        <div class="score-text">${evalText || ''}</div>
      </div>
      <div class="choice-log">${log}</div>
    </div>
    ${learningHtml}
    <div class="ending-section page-enter">
      <div class="ending-section-title">── 歴史的概念カード ──</div>
      <div class="concept-intro">このシミュレーションが深めた歴史の見方・考え方を整理します。</div>
      <div class="concept-grid">${cards}</div>
    </div>
    <button class="restart-btn" onclick="restart()">もう一度プレイ</button>`;
}

function startTimer() {
  timerRemaining = META.timerSeconds || 60;
  timerRunning = true;
  updateTimer();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!timerRunning) return;
    timerRemaining--;
    updateTimer();
    if (timerRemaining <= 0) {
      timerRunning = false;
      clearInterval(timerInterval);
    }
  }, 1000);
}

function updateTimer() {
  const el = document.getElementById('timerCount');
  if (!el) return;
  const sec = Math.max(0, timerRemaining);
  el.textContent = `${String(Math.floor(sec / 60)).padStart(2,'0')}:${String(sec % 60).padStart(2,'0')}`;
}

function resetTimer() {
  startTimer();
}

function goNext(next) {
  if (!next) return;
  S.passage = next;
  S.lineIdx = 0;
  S.showResult = false;
  S.pendingChoice = null;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function restart() {
  clearInterval(timerInterval);
  S = { passage: 'title', lineIdx: 0, showResult: false, pendingChoice: null, matches: 0, log: [] };
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

document.addEventListener('keydown', (e) => {
  const passage = P && P[S.passage];
  if (!passage) return;
  if (passage.type === 'story' && ['Space','Enter','ArrowRight'].includes(e.code)) {
    e.preventDefault();
    advanceLine();
  }
  if (passage.type === 'decision' && !S.showResult) {
    const idx = { a:0, b:1, c:2, d:3, '1':0, '2':1, '3':2, '4':3 }[e.key.toLowerCase()];
    if (idx !== undefined) choose(idx);
  }
  if (passage.type === 'decision' && S.showResult && ['Space','Enter'].includes(e.code)) {
    e.preventDefault();
    goNextFromResult();
  }
});

loadScenario();
</script>
</body>
</html>
