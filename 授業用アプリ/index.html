    body { font-family: 'Noto Sans JP', sans-serif; }
    * { box-sizing: border-box; }
    input[type="range"] { cursor: pointer; width: 100%; }

    const { useState, useCallback, useEffect, useRef, useMemo } = React;

    // ============================================================

    // ============================================================

    const DISTRICTS = [
      { id:"d1", name:"第1区（沿岸部）", short:"第1区", feature:"漁業・観光・高齢者が多い",

        voters:{ elderly:15, middle:40, young:45 }, issues:["奨学金","物価","デジタル化"], color:"#F59E0B" }

      { id:"hozen",   name:"港湾保守党",   color:"#DC2626", base:"高齢者・伝統産業", policy:"漁業保護・医療充実・地域重視", isPlayer:false, baseSupport:{ d1:35, d2:25, d3:18 } },
      { id:"rengo",   name:"市民連合",     color:"#CA8A04", base:"無党派・幅広い層", policy:"物価対策・子育て・中道",       isPlayer:false, baseSupport:{ d1:17, d2:18, d3:22 } }

    const ACTIVITIES = [
      { id:"street",  name:"街頭演説",    minCost:10, effectMultiplier:{ elderly:1.5, middle:1.3, young:0.7 } },

    const EVENTS = [
      { id:"scandal",   name:"🚨 スキャンダル発覚",  description:"対立候補に不祥事発覚！無党派層が流動化しています",                      effect:{ unpolitical:+5 } },
      { id:"fishery",   name:"🐟 漁業不況ニュース",   description:"第1区で漁業不況が深刻化。高齢者・沿岸部の関心が高まっています",        effect:{ d1Boost:+8 } },
      { id:"sns_viral", name:"📱 SNS拡散",           description:"若者の政治関心が急上昇！第3区・若者層の投票率が上がっています",         effect:{ youngBoost:+8, d3Boost:+5 } },
      { id:"inflation", name:"📈 物価高騰ニュース",   description:"物価高騰が話題に。中年・無党派層への訴えかけが有効になっています",      effect:{ middleBoost:+6 } }

    const INITIAL_TEAMS = Array.from({ length:10 }, (_, i) => ({
      id: i + 1, name: `${i + 1}班`, submitted: false,
      strategy: {
        districtAllocation: { d1:34, d2:33, d3:33 },
        activities: {
          d1:{ street:0, sns:0, poster:0, visit:0, debate:0 },
          d2:{ street:0, sns:0, poster:0, visit:0, debate:0 },
          d3:{ street:0, sns:0, poster:0, visit:0, debate:0 }
        },
        memo: ""
      },
      results: { d1VoteRate:null, d2VoteRate:null, d3VoteRate:null, totalVoteRate:null, rank:null }
    }));

    const SCREEN_LABELS = {
      teamSelect:"班選択", scenario:"① シナリオ説明", strategy:"② 戦略入力",
      confirm:"③ 戦略確認", submitted:"提出完了", results_district:"④ 小選挙区結果",
      dontMethod:"⑤ ドント式計算", results_final:"⑥ 最終結果", teacher:"教師管理画面"
    };

    // ============================================================
    // ヘルパー関数（フェーズ1&2）
    // ============================================================

    function adjustDistrictSliders(changed, newValue, prev) {
      const v = Math.max(0, Math.min(100, newValue));
      const others = ["d1","d2","d3"].filter(k => k !== changed);
      const otherSum = others.reduce((s, k) => s + prev[k], 0);
      const remaining = 100 - v;
      const result = { ...prev, [changed]: v };
      if (otherSum === 0) {
        result[others[0]] = Math.floor(remaining / 2);
        result[others[1]] = remaining - result[others[0]];
      } else {
        let distributed = 0;
        others.forEach((k, i) => {
          if (i < others.length - 1) {
            const share = Math.round(remaining * prev[k] / otherSum);
            result[k] = Math.max(0, share); distributed += result[k];
          } else { result[k] = Math.max(0, remaining - distributed); }
        });
      }
      const total = result.d1 + result.d2 + result.d3;
      if (total !== 100) { const fix = others.find(k => result[k] > 0) || others[0]; result[fix] = Math.max(0, result[fix] + (100 - total)); }
      return result;
    }

    function calculateTotalPoints(activities) {
      return ["d1","d2","d3"].reduce((sum, d) =>
        sum + Object.values(activities[d]).reduce((s, v) => s + (Number(v) || 0), 0), 0);
    }

    function calculateVoteRate(team, district, activeEvents) {
      const d = district.id;
      let voteRate = PARTIES.find(p => p.isPlayer).baseSupport[d];
      const districtWeight = team.strategy.districtAllocation[d] / 100;
      voteRate += districtWeight * 10;
      const acts = team.strategy.activities[d];
      const vc = district.voters;
      ACTIVITIES.forEach(activity => {
        const points = Number(acts[activity.id]) || 0;
        if (points === 0) return;
        const elderlyEff = (points / 100) * activity.effectMultiplier.elderly * (vc.elderly / 100);
        const middleEff  = (points / 100) * activity.effectMultiplier.middle  * (vc.middle  / 100);
        const youngEff   = (points / 100) * activity.effectMultiplier.young   * (vc.young   / 100);
        voteRate += (elderlyEff + middleEff + youngEff) * 15;
      });
      activeEvents.forEach(event => {
        if (event.id === "fishery"   && d === "d1") voteRate += 5;
        if (event.id === "sns_viral" && d === "d3") voteRate += 4;
        if (event.id === "inflation")               voteRate += 3;
        if (event.id === "scandal")                 voteRate += 3;
      });
      return Math.min(Math.max(voteRate, 5), 60);
    }

    function calculateAIVoteRate(party, district, activeEvents) {
      const d = district.id;
      let voteRate = party.baseSupport[d];
      const aiBonus = { kaikaku:{ d3:18, d1:4, d2:4 }, hozen:{ d1:20, d2:4, d3:4 }, rengo:{ d1:8, d2:8, d3:8 } };
      const bonus = (aiBonus[party.id] || {})[d] || 5;
      voteRate += bonus / 100 * 10;
      activeEvents.forEach(e => {
        if (e.id === "fishery"   && d === "d1" && party.id === "hozen")   voteRate += 6;
        if (e.id === "sns_viral" && d === "d3" && party.id === "kaikaku") voteRate += 6;
      });
      const seed = party.id.charCodeAt(0) + d.charCodeAt(1);
      voteRate += Math.sin(seed) * 3;
      return Math.min(Math.max(voteRate, 5), 55);
    }

    function effectIcon(m) {
      if (m >= 1.5) return { label:"強", color:"#FCD34D" };
      if (m >= 1.0) return { label:"中", color:"#86EFAC" };
      return { label:"弱", color:"#6B7280" };
    }

    // ============================================================
    // ヘルパー関数（フェーズ3）
    // ============================================================

    function computeDistrictResult(teams, district, activeEvents) {
      const playerParty = PARTIES.find(p => p.isPlayer);
      const teamRaws = teams.map(team => ({ team, rawRate: calculateVoteRate(team, district, activeEvents) }));
      const avgPlayerRaw = teamRaws.reduce((s, r) => s + r.rawRate, 0) / teams.length;
      const aiRaws = PARTIES.filter(p => !p.isPlayer).map(party => ({
        party, rawRate: calculateAIVoteRate(party, district, activeEvents)
      }));
      const allRaw = [{ party: playerParty, rawRate: avgPlayerRaw }, ...aiRaws];
      const totalRaw = allRaw.reduce((s, r) => s + r.rawRate, 0);
      const partyRates = allRaw.map(r => ({
        party: r.party,
        voteRate: Math.round((r.rawRate / totalRaw) * 1000) / 10
      })).sort((a, b) => b.voteRate - a.voteRate);
      const winner = partyRates[0];
      const deadVoteRate = Math.round((100 - winner.voteRate) * 10) / 10;
      const teamRanking = [...teamRaws]
        .sort((a, b) => b.rawRate - a.rawRate)
        .map(r => ({ team: r.team, rawRate: Math.round(r.rawRate * 10) / 10 }));
      return { district, partyRates, winner, deadVoteRate, teamRanking };
    }

    function computeSmallSeats(allResults) {
      const seats = Object.fromEntries(PARTIES.map(p => [p.id, 0]));
      allResults.forEach(dr => { if (dr.winner) seats[dr.winner.party.id]++; });
      return seats;
    }

    function computeDhont(votes, totalSeats) {
      const ids = Object.keys(votes);
      const seats = Object.fromEntries(ids.map(id => [id, 0]));
      for (let i = 0; i < totalSeats; i++) {
        let maxQ = -Infinity, winner = null;
        ids.forEach(id => { const q = votes[id] / (seats[id] + 1); if (q > maxQ) { maxQ = q; winner = id; } });
        seats[winner]++;
      }
      return seats;
    }

    function dhontValue(votes, divisor) {
      const v = votes / divisor;
      return Number.isInteger(v) ? v : Math.round(v * 10) / 10;
    }

    function getDhontTop10() {
      const cells = [];
      Object.keys(PROPORTIONAL_VOTES).forEach(id => {
        [1,2,3,4,5].forEach(div => cells.push({ key:`${id}-${div}`, value: PROPORTIONAL_VOTES[id] / div }));
      });
      cells.sort((a, b) => b.value - a.value);
      return new Set(cells.slice(0, PROP_SEATS_TOTAL).map(c => c.key));
    }

    // ============================================================
    // PasswordModal
    // ============================================================

    function PasswordModal({ onSuccess, onCancel }) {
      const [value, setValue] = useState("");
      const [error, setError] = useState(false);
      function submit() {
        if (value === "teacher2025") { onSuccess(); }
        else { setError(true); setValue(""); setTimeout(() => setError(false), 2000); }
      }
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center scale-in" style={{ background:"rgba(0,0,0,0.75)" }}>
          <div className="rounded-2xl p-6 w-80" style={{ background:"#1A3050", border:"2px solid rgba(239,68,68,0.5)" }}>
            <p className="font-black text-white text-lg mb-1">🔐 教師専用画面</p>
            <p className="text-xs mb-4" style={{ color:"rgba(255,255,255,0.4)" }}>パスワードを入力してください</p>
            <input type="password" value={value}
              onChange={e => setValue(e.target.value)}
              onKeyDown={e => e.key === "Enter" && submit()}
              placeholder="パスワード" autoFocus
              className="w-full rounded-xl px-4 py-3 text-white mb-1 outline-none"
              style={{ background:"rgba(255,255,255,0.1)", border:`1px solid ${error?"#EF4444":"rgba(255,255,255,0.2)"}`, fontFamily:"inherit" }} />
            {error && <p className="text-xs mb-2" style={{ color:"#F87171" }}>パスワードが違います</p>}
            <div className={`flex gap-2 ${error?"mt-0":"mt-3"}`}>
              <button onClick={onCancel} className="flex-1 py-2.5 rounded-xl text-sm font-bold"
                style={{ background:"rgba(255,255,255,0.07)", color:"rgba(255,255,255,0.5)", border:"none", cursor:"pointer" }}>キャンセル</button>
              <button onClick={submit} className="flex-1 py-2.5 rounded-xl text-sm font-bold text-white"
                style={{ background:"#2563EB", border:"none", cursor:"pointer" }}>ログイン</button>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // CountdownTimer
    // ============================================================

    function CountdownTimer({ seconds, label }) {
      const min = Math.floor(Math.max(0, seconds) / 60);
      const sec = Math.max(0, seconds) % 60;
      const isLow = seconds > 0 && seconds <= 60;
      const isDone = seconds <= 0;
      return (
        <div className="text-center rounded-xl p-3" style={{ background:"rgba(0,0,0,0.3)", border:`1px solid ${isLow?"rgba(239,68,68,0.6)":"rgba(255,255,255,0.1)"}` }}>
          <p className="text-xs mb-1" style={{ color:"rgba(255,255,255,0.4)" }}>{label}</p>
          <p className={`font-black text-4xl leading-none ${isLow?"timer-pulse":""}`}
            style={{ color:isDone?"rgba(255,255,255,0.2)":isLow?"#F87171":"#4ADE80", fontFamily:"monospace", letterSpacing:"0.05em" }}>
            {isDone ? "--:--" : `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`}
          </p>
        </div>
      );
    }

    // ============================================================
    // CityMap (SVG)
    // ============================================================

    function CityMap({ selectedDistrict, onSelect }) {

            <pattern id="seaPattern" patternUnits="userSpaceOnUse" width="20" height="8">

              <text x={a.cx} y={a.cy+8} textAnchor="middle" fill={a.color} fontSize="9" opacity="0.7" fontFamily="sans-serif">{a.sub}</text>

    // ============================================================
    // EventBanner
    // ============================================================

    function EventBanner({ events }) {
      const [expanded, setExpanded] = useState(false);
      const prevLen = useRef(0);
      useEffect(() => {
        if (events.length > prevLen.current) {
          setExpanded(true);
          const t = setTimeout(() => setExpanded(false), 3000);
          prevLen.current = events.length;
          return () => clearTimeout(t);
        }
        prevLen.current = events.length;
      }, [events.length]);
      if (events.length === 0) return null;
      const latest = events[events.length - 1];
      if (expanded) {
        return (
          <div className="rounded-xl p-4 mb-4" style={{ background:"rgba(153,27,27,0.7)", border:"1px solid #EF4444" }}>
            <p className="font-black text-lg" style={{ color:"#FCA5A5" }}>{latest.name}</p>
            <p className="text-sm mt-1" style={{ color:"#FEE2E2" }}>{latest.description}</p>
          </div>
        );
      }
      return (
        <div className="rounded-lg px-3 py-2 mb-4 flex items-center gap-2 flex-wrap"
          style={{ background:"rgba(153,27,27,0.35)", border:"1px solid rgba(239,68,68,0.4)" }}>
          <span className="text-xs" style={{ color:"#FCA5A5" }}>📢 発生中のイベント:</span>
          {events.map(e => (
            <span key={e.id} className="text-xs rounded px-2 py-0.5"
              style={{ background:"rgba(153,27,27,0.5)", color:"#FEE2E2" }}>{e.name}</span>
          ))}
        </div>
      );
    }

    // ============================================================

    const OPPONENT_HINTS = [
      "🔍 海風改革党が第3区のSNS広告に注力している模様…",

        background:"rgba(255,255,255,0.07)", border:"1px solid rgba(255,255,255,0.12)",

            <div className="text-right">

                {remaining}
              </p>
              <p className="text-xs mt-0.5" style={{ color:isOver?"#F87171":remaining===0?"#FCD34D":"rgba(255,255,255,0.3)" }}>
                {isOver ? "⚠️ 超過しています" : remaining === 0 ? "✅ 使い切りました" : "/ 100pt"}

            </div>

                  </div>
                  <span className="font-black text-xl" style={{ color:d.color }}>{allocation[d.id]}%</span>

                <input type="range" min="0" max="100" value={allocation[d.id]}

                  <span>👴 高齢者 {d.voters.elderly}%</span>
                  <span>👔 中年 {d.voters.middle}%</span>
                  <span>👩 若者 {d.voters.young}%</span>
                </div>
                <div className="flex gap-1 mt-1 flex-wrap">
                  {d.issues.map(issue => (
                    <span key={issue} className="text-xs px-2 py-0.5 rounded-full"

              {DISTRICTS.map(d => (
                <div key={d.id} style={{ width:`${allocation[d.id]}%`, background:d.color, transition:"width 0.25s ease" }} />

          </div>
          <div style={sec}>

                <thead>
                  <tr style={{ borderBottom:"1px solid rgba(255,255,255,0.1)" }}>

                      <th key={d.id} className="text-center py-2 text-xs font-bold" style={{ color:d.color }}>{d.short}</th>
                    ))}
                    <th className="text-center py-2 text-xs font-normal" style={{ color:"rgba(255,255,255,0.4)" }}>合計</th>
                  </tr>
                </thead>
                <tbody>
                  {ACTIVITIES.map(act => {
                    const rt = rowTotal(act.id);
                    return (
                      <tr key={act.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.05)" }}>

                          <p className="font-bold text-white text-xs">{act.name}</p>
                          <div className="flex gap-1 mt-0.5">

                              const ic = effectIcon(act.effectMultiplier[k]);

                    {DISTRICTS.map(d => (
                      <td key={d.id} className="py-2 text-center font-bold text-sm" style={{ color:d.color }}>{colTotal(d.id)}</td>

                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
          <div style={sec}>
            <h3 className="font-black text-white mb-3">🕵️ 対立候補の動向</h3>
            {OPPONENT_HINTS.map((hint, i) => <p key={i} className="text-sm mb-1" style={{ color:"rgba(255,255,255,0.35)" }}>{hint}</p>)}
          </div>
          <div style={sec}>

            <p className="text-xs mb-2" style={{ color:"rgba(255,255,255,0.4)" }}>この班の戦略の理由を記録しよう（最大200文字）</p>
            <textarea value={memo} onChange={e => setMemo(e.target.value.slice(0,200))} rows={3}
              placeholder="例：第3区の若者層にSNS広告を集中させ、比例票も狙う戦略…"
              style={{ width:"100%", borderRadius:"8px", padding:"10px 12px", background:"rgba(255,255,255,0.05)",
                border:"1px solid rgba(255,255,255,0.12)", color:"white", outline:"none", resize:"none", fontSize:"14px" }} />
            <p className="text-xs text-right mt-1" style={{ color:"rgba(255,255,255,0.25)" }}>{memo.length} / 200</p>
          </div>
          <button onClick={() => !isOver && onSaveAndNext({ districtAllocation:allocation, activities, memo })}
            disabled={isOver} className="w-full font-black text-lg transition-all"
            style={{
              padding:"16px", borderRadius:"12px",
              background:isOver?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#2563EB,#1D4ED8)",
              border:`1px solid ${isOver?"rgba(255,255,255,0.08)":"#3B82F6"}`,
              color:isOver?"#6B7280":"white", cursor:isOver?"not-allowed":"pointer"
            }}>
            {isOver ? "⚠️ ポイントが超過しています — 配分を見直してください" : "戦略を確定する →"}
          </button>
        </div>
      );
    }

      function rowTotal(actId) { return ["d1","d2","d3"].reduce((s,d)=>s+(strategy.activities[d][actId]||0),0); }

                </div>

                  <div style={{ width:"10px", height:"10px", borderRadius:"2px", background:d.color }} />
                  <span className="text-xs" style={{ color:"rgba(255,255,255,0.55)" }}>{d.short} {strategy.districtAllocation[d.id]}%</span>

          <div style={sec}>

            <div style={{ overflowX:"auto" }}>

                    {DISTRICTS.map(d => <th key={d.id} className="text-center py-1.5 text-xs font-bold" style={{ color:d.color }}>{d.short}</th>)}

                <tbody>

                    return (
                      <tr key={act.id} style={{ borderBottom:"1px solid rgba(255,255,255,0.05)" }}>
                        <td className="py-1.5 text-xs" style={{ color:"rgba(255,255,255,0.75)" }}>{act.name}</td>
                        {DISTRICTS.map(d => <td key={d.id} className="py-1.5 text-center font-bold text-sm text-white">{strategy.activities[d.id][act.id]||0}</td>)}

    // ============================================================
    // DistrictResultCard（小選挙区1区分の詳細カード）
    // ============================================================

    function DistrictResultCard({ result }) {
      const [animated, setAnimated] = useState(false);
      useEffect(() => {
        const t = setTimeout(() => setAnimated(true), 80);
        return () => clearTimeout(t);
      }, []);

      const winner = result.partyRates[0];
      const medal = (i) => i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : null;
      const sec = { background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"12px", padding:"16px", marginBottom:"12px" };

      return (
        <div className="fade-up">
          {/* 開票結果タイトル */}
          <div className="text-center mb-4">
            <p className="text-sm font-bold" style={{ color:"rgba(255,255,255,0.5)" }}>{result.district.feature}</p>
            <h3 className="text-2xl font-black text-white">{result.district.name} 開票結果</h3>
          </div>

          {/* 政党バーグラフ */}
          <div style={sec}>
            {result.partyRates.map((pr, i) => {
              const isWinner = pr.party.id === winner.party.id;
              return (
                <div key={pr.party.id} className="mb-3 rounded-lg p-3" style={{
                  background: isWinner ? `${pr.party.color}18` : "transparent",
                  border: `1px solid ${isWinner ? pr.party.color : "rgba(255,255,255,0.06)"}`,
                  boxShadow: isWinner ? `0 0 16px ${pr.party.color}30` : "none"
                }}>
                  <div className="flex items-center justify-between mb-1.5">
                    <div className="flex items-center gap-2">
                      <span className="font-bold text-sm" style={{ color:pr.party.color }}>{pr.party.name}</span>
                      {isWinner && (
                        <span className="text-xs px-2 py-0.5 rounded-full font-black text-white"
                          style={{ background:"linear-gradient(135deg,#B45309,#92400E)", border:"1px solid #F59E0B" }}>
                          🏆 当選
                        </span>
                      )}
                    </div>
                    <span className="font-black text-lg" style={{ color: isWinner ? "#FCD34D" : pr.party.color }}>
                      {pr.voteRate.toFixed(1)}%
                    </span>
                  </div>
                  <div className="overflow-hidden rounded-full" style={{ height:"24px", background:"rgba(255,255,255,0.07)" }}>
                    <div style={{
                      width: animated ? `${pr.voteRate}%` : "0%", height:"100%",
                      background: isWinner ? `linear-gradient(90deg,${pr.party.color},${pr.party.color}cc)` : pr.party.color,
                      transition: `width 1.2s ease-out ${i * 0.2}s`, borderRadius:"9999px",
                      boxShadow: isWinner ? `0 0 10px ${pr.party.color}80` : "none"
                    }} />
                  </div>
                </div>
              );
            })}
          </div>

          {/* 死票率 */}
          <div className="text-center rounded-xl p-5 mb-3" style={{ background:"rgba(239,68,68,0.08)", border:"1px solid rgba(239,68,68,0.3)" }}>
            <p className="text-sm font-bold mb-1" style={{ color:"rgba(255,255,255,0.5)" }}>死 票 率</p>
            <p className="font-black" style={{ fontSize:"60px", color:"#F87171", lineHeight:1 }}>
              {result.deadVoteRate.toFixed(1)}%
            </p>
            <p className="text-sm mt-2" style={{ color:"rgba(255,255,255,0.45)" }}>
              この選挙区では <span style={{ color:"#F87171", fontWeight:"bold" }}>{result.deadVoteRate.toFixed(1)}%</span> の票が議席に結びつきませんでした
            </p>
          </div>

          {/* 班別ランキング */}
          <div style={sec}>
            <h4 className="font-black text-white text-sm mb-3">みなと未来党 班別得票率</h4>
            <div className="grid grid-cols-2 gap-1.5">
              {result.teamRanking.map((item, i) => {
                const m = medal(i);
                return (
                  <div key={item.team.id} className="flex items-center justify-between rounded-lg px-3 py-2"
                    style={{
                      background: m ? "rgba(255,255,255,0.08)" : "rgba(255,255,255,0.03)",
                      border: `1px solid ${m ? "rgba(255,255,255,0.15)" : "rgba(255,255,255,0.05)"}`
                    }}>
                    <span className="text-sm font-bold" style={{ color:m?"white":"rgba(255,255,255,0.45)" }}>
                      {m || `${i+1}.`} {item.team.name}
                    </span>
                    <span className="font-black text-sm" style={{ color:m?"#FCD34D":"rgba(255,255,255,0.35)" }}>
                      {item.rawRate.toFixed(1)}%
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================

      const [viewing, setViewing] = useState(() => revealedDistrict > 0 ? revealedDistrict - 1 : null);
      const prevRevealed = useRef(revealedDistrict);

      useEffect(() => {
        if (revealedDistrict > prevRevealed.current) {
          prevRevealed.current = revealedDistrict;
          setViewing(revealedDistrict - 1);
        }
      }, [revealedDistrict]);

      const allResults = useMemo(() => DISTRICTS.map(d => computeDistrictResult(teams, d, activeEvents)), [teams, activeEvents]);
      const smallSeats = useMemo(() => computeSmallSeats(allResults), [allResults]);

      const tabStyle = (active) => ({
        padding:"8px 14px", borderRadius:"8px", fontWeight:"bold", fontSize:"13px",
        cursor:"pointer", border:"none", transition:"all 0.2s",

        color: active ? "white" : "rgba(255,255,255,0.55)"
      });

      const ctrlBtn = (label, onClick, primary=false) => (
        <button onClick={onClick} className="w-full font-black text-base text-white"
          style={{
            padding:"14px", borderRadius:"12px",
            background: primary ? "linear-gradient(135deg,#2563EB,#1D4ED8)" : "rgba(255,255,255,0.1)",
            border: `1px solid ${primary ? "#3B82F6" : "rgba(255,255,255,0.2)"}`
          }}>
          {label}

      if (revealedDistrict === 0) {

            <div style={{ fontSize:"64px", marginBottom:"16px" }}>🗳️</div>

            <p className="text-sm mb-8" style={{ color:"rgba(255,255,255,0.5)" }}>準備ができたら第1区から発表してください</p>
            <button onClick={onReveal} className="font-black text-lg text-white"
              style={{ padding:"16px 40px", borderRadius:"12px", background:"linear-gradient(135deg,#DC2626,#B91C1C)", border:"1px solid #EF4444", boxShadow:"0 0 20px rgba(239,68,68,0.3)" }}>
              🗳️ 第1区を発表する

      return (
        <div style={{ paddingBottom:"32px" }}>
          {/* タブナビ */}
          <div className="flex gap-2 mb-5 flex-wrap">

              <button key={d.id} style={tabStyle(viewing === i)} onClick={() => setViewing(i)}>
                {d.short}

            ))}
            {revealedDistrict >= 3 && (
              <button style={tabStyle(viewing === "summary")} onClick={() => setViewing("summary")}>
                まとめ
              </button>
            )}

          {/* メインコンテンツ */}
          {viewing === "summary"
            ? <DistrictSummary key="summary" allResults={allResults} smallSeats={smallSeats} />
            : viewing !== null && <DistrictResultCard key={viewing} result={allResults[viewing]} />

          {/* コントロール */}
          <div className="mt-5 flex gap-3">
            {revealedDistrict < 3 && ctrlBtn(
              `🗳️ 第${revealedDistrict + 1}区を発表する`, onReveal, true
            )}
            {revealedDistrict >= 3 && viewing !== "summary" && ctrlBtn(
              "まとめを見る →", () => setViewing("summary")
            )}
            {revealedDistrict >= 3 && viewing === "summary" && ctrlBtn(
              "ドント式計算へ →", onNext, true
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // DontMethodScreen（フェーズ3実装）
    // ============================================================

    const DHONT_PARTY_ORDER = ["mirai","kaikaku","hozen","rengo"];

    function DontMethodScreen({ teams, activeEvents, onNext }) {
      const initInputs = () => Object.fromEntries(
        DHONT_PARTY_ORDER.map(id => [id, Object.fromEntries(DHONT_DIVISORS.map(d => [d, ""]))])
      );

      const propSeats = useMemo(() => computeDhont(PROPORTIONAL_VOTES, PROP_SEATS_TOTAL), []);

      function handleInput(partyId, divisor, val) {
        setInputs(prev => ({ ...prev, [partyId]: { ...prev[partyId], [divisor]: val } }));

        width:"68px", textAlign:"center", padding:"7px 4px", fontWeight:"700",

        <div style={{ paddingBottom:"32px" }}>

              <p className="text-sm text-white font-bold mb-1">計算ルール</p>
              <p className="text-sm" style={{ color:"rgba(255,255,255,0.7)" }}>
                各政党の得票数を ÷1、÷2、÷3… と割り続け、<br />
                商の大きい順に議席を配分する方法です。
              </p>
            </div>
            <div className="flex gap-2 flex-wrap">
              {DHONT_PARTY_ORDER.map(id => {
                const p = PARTIES.find(p => p.id === id);
                return (
                  <div key={id} className="rounded-lg px-3 py-2" style={{ background:`${p.color}20`, border:`1px solid ${p.color}50` }}>
                    <p className="text-xs font-bold" style={{ color:p.color }}>{p.name}</p>
                    <p className="font-black text-white">{PROPORTIONAL_VOTES[id]}万票</p>
                  </div>
                );
              })}
              <div className="rounded-lg px-3 py-2" style={{ background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)" }}>
                <p className="text-xs font-bold" style={{ color:"rgba(255,255,255,0.5)" }}>配分議席</p>
                <p className="font-black text-white">{PROP_SEATS_TOTAL}議席</p>
              </div>
            </div>
          </div>

          {/* 計算表 */}
          <div style={sec}>
            <div className="flex items-center justify-between mb-3">

              {!revealed && (
                <span className="text-xs px-2 py-1 rounded-full" style={{ background:"rgba(245,158,11,0.2)", color:"#FCD34D", border:"1px solid #F59E0B" }}>
                  上位{PROP_SEATS_TOTAL}マスが議席獲得

              )}
            </div>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", minWidth:"520px", borderCollapse:"collapse" }}>
                <thead>
                  <tr style={{ borderBottom:"1px solid rgba(255,255,255,0.12)" }}>
                    <th className="py-2 pr-3 text-left text-xs font-normal" style={{ color:"rgba(255,255,255,0.4)", width:"44px" }}>÷</th>
                    {DHONT_PARTY_ORDER.map(id => {
                      const p = PARTIES.find(p => p.id === id);
                      return (
                        <th key={id} className="py-2 text-center" style={{ color:p.color }}>
                          <p className="font-black text-sm">{p.name}</p>
                          <p className="text-xs font-normal" style={{ color:`${p.color}99` }}>{PROPORTIONAL_VOTES[id]}万票</p>
                        </th>
                      );
                    })}
                  </tr>
                </thead>
                <tbody>
                  {DHONT_DIVISORS.map(div => (
                    <tr key={div} style={{ borderBottom:"1px solid rgba(255,255,255,0.05)" }}>
                      <td className="py-2.5 pr-3 font-black text-lg" style={{ color:"rgba(255,255,255,0.5)" }}>÷{div}</td>
                      {DHONT_PARTY_ORDER.map(id => {
                        const p = PARTIES.find(p => p.id === id);
                        const isTop = top10.has(`${id}-${div}`);
                        const answer = dhontValue(PROPORTIONAL_VOTES[id], div);
                        const cellKey = `${revealed}-${id}-${div}`;
                        return (
                          <td key={id} className="py-2.5 text-center">
                            {revealed ? (
                              <span key={cellKey}
                                className={isTop ? "top-cell-reveal" : "cell-reveal"}
                                style={{
                                  display:"inline-block", width:"68px", padding:"7px 4px",
                                  borderRadius:"8px", fontWeight:"900", fontSize:"14px",
                                  color:"white", border:`1px solid ${isTop ? "#F59E0B" : "rgba(255,255,255,0.1)"}`

            <button onClick={() => setRevealed(true)}
              className="w-full font-black text-lg text-white mb-4"
              style={{ padding:"16px", borderRadius:"12px", background:"linear-gradient(135deg,#D97706,#B45309)", border:"1px solid #F59E0B" }}>
              🔍 答え合わせ

              </div>
              <button onClick={onNext} className="w-full font-black text-lg text-white"
                style={{ padding:"16px", borderRadius:"12px", background:"linear-gradient(135deg,#2563EB,#1D4ED8)", border:"1px solid #3B82F6" }}>
                比例議席を確定する → 最終結果へ
              </button>
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // FinalResultsScreen（フェーズ3実装）
    // ============================================================

    const DISCUSSION_QUESTIONS = [
      "① 得票率と議席率はなぜずれているのか？",
      "② 小選挙区制と比例代表制、どちらが民意を反映しているか？",
      "③ あなたならどの選挙区を捨てたか？それはなぜか？"
    ];

    function FinalResultsScreen({ teams, activeEvents }) {
      const allResults = useMemo(() => DISTRICTS.map(d => computeDistrictResult(teams, d, activeEvents)), [teams, activeEvents]);
      const smallSeats = useMemo(() => computeSmallSeats(allResults), [allResults]);
      const propSeats  = useMemo(() => computeDhont(PROPORTIONAL_VOTES, PROP_SEATS_TOTAL), []);

      const totalSeats = Object.fromEntries(PARTIES.map(p => [p.id, (smallSeats[p.id]||0) + (propSeats[p.id]||0)]));
      const totalSeatCount = Object.values(totalSeats).reduce((s,v) => s+v, 0);

      const totalVotes = Object.values(PROPORTIONAL_VOTES).reduce((s,v) => s+v, 0);
      const voteShares = Object.fromEntries(Object.entries(PROPORTIONAL_VOTES).map(([id,v]) => [id, (v/totalVotes)*100]));
      const seatShares = Object.fromEntries(Object.entries(totalSeats).map(([id,s]) => [id, (s/totalSeatCount)*100]));

      // チームランキング（全3区の平均得票率）
      const teamRankings = useMemo(() => teams.map(team => ({
        team,
        avgRate: allResults.reduce((s, r) => {
          const tr = r.teamRanking.find(x => x.team.id === team.id);
          return s + (tr ? tr.rawRate : 0);
        }, 0) / allResults.length
      })).sort((a, b) => b.avgRate - a.avgRate), [teams, allResults]);

      const sec = { background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:"12px", padding:"16px", marginBottom:"16px" };

      const podiumItems = teamRankings.slice(0, 3);
      const podiumHeights = [90, 120, 70]; // 2nd, 1st, 3rd
      const podiumOrder = [podiumItems[1], podiumItems[0], podiumItems[2]]; // center=1st
      const podiumColors = ["#94A3B8","#EAB308","#CD7F32"];
      const podiumLabels = ["1位","2位","3位"];
      const podiumHeightOrder = [podiumHeights[0], podiumHeights[1], podiumHeights[2]]; // center=1st height

      return (
        <div style={{ paddingBottom:"32px" }}>
          <div className="text-center mb-5">
            <h2 className="text-2xl font-black text-white">⑥ 最終結果</h2>
            <p className="text-sm mt-1" style={{ color:"rgba(255,255,255,0.5)" }}>小選挙区 + 比例代表 合計議席</p>
          </div>

          {/* 最終議席数 */}
          <div style={sec}>
            <h3 className="font-black text-white mb-4">🏛️ 最終議席数（合計{totalSeatCount}議席）</h3>
            {PARTIES.map(p => {
              const total = totalSeats[p.id] || 0;
              const small = smallSeats[p.id] || 0;
              const prop  = propSeats[p.id] || 0;
              return (
                <div key={p.id} className="mb-3">
                  <div className="flex items-center justify-between mb-1">
                    <span className="font-bold text-sm" style={{ color:p.color }}>{p.name}</span>
                    <span className="font-black text-xl" style={{ color:p.color }}>{total}議席</span>
                  </div>
                  <div className="flex rounded-lg overflow-hidden" style={{ height:"28px" }}>
                    {small > 0 && (
                      <div className="flex items-center justify-center text-xs font-bold text-white"
                        style={{ width:`${(small/totalSeatCount)*100}%`, background:p.color }}>
                        小{small}
                      </div>
                    )}
                    {prop > 0 && (
                      <div className="flex items-center justify-center text-xs font-bold text-white"
                        style={{ width:`${(prop/totalSeatCount)*100}%`, background:`${p.color}88`, borderLeft:`1px solid ${p.color}` }}>
                        比{prop}
                      </div>
                    )}
                    <div style={{ flex:1, background:"rgba(255,255,255,0.05)" }} />
                  </div>
                </div>
              );
            })}
            <div className="flex gap-4 mt-2 text-xs" style={{ color:"rgba(255,255,255,0.4)" }}>
              <span>■ 濃色 = 小選挙区</span>
              <span>■ 薄色 = 比例代表</span>
            </div>
          </div>

          {/* 民意 vs 議席 比較グラフ */}

            <h3 className="font-black text-white mb-1">⚖️ 民意 vs 議席率の比較</h3>
            <p className="text-xs mb-4" style={{ color:"rgba(255,255,255,0.4)" }}>得票率（全国比例）と議席率の差を確認しよう</p>
            {PARTIES.map(p => {
              const vote = voteShares[p.id];
              const seat = seatShares[p.id];
              const diff = Math.abs(seat - vote);
              const over = diff > 7;
              return (
                <div key={p.id} className="mb-4">
                  <div className="flex items-center gap-2 mb-1">
                    <span className="font-bold text-sm" style={{ color:p.color }}>{p.name}</span>
                    {over && <span className="text-xs px-2 py-0.5 rounded-full" style={{ background:"rgba(239,68,68,0.2)", color:"#F87171", border:"1px solid rgba(239,68,68,0.3)" }}>⚠️ ずれが大きい</span>}
                  </div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-xs w-12 text-right" style={{ color:"rgba(255,255,255,0.4)" }}>得票率</span>
                    <div className="flex-1 rounded-full overflow-hidden" style={{ height:"16px", background:"rgba(255,255,255,0.07)" }}>
                      <div style={{ width:`${vote}%`, height:"100%", background:p.color, borderRadius:"9999px" }} />
                    </div>
                    <span className="text-xs w-10 font-bold" style={{ color:p.color }}>{vote.toFixed(1)}%</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs w-12 text-right" style={{ color:"rgba(255,255,255,0.4)" }}>議席率</span>
                    <div className="flex-1 rounded-full overflow-hidden" style={{ height:"16px", background:"rgba(255,255,255,0.07)" }}>
                      <div style={{ width:`${seat}%`, height:"100%", background:`${p.color}77`, borderRadius:"9999px", border:`1px dashed ${p.color}` }} />
                    </div>
                    <span className="text-xs w-10 font-bold" style={{ color:`${p.color}aa` }}>{seat.toFixed(1)}%</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* 班別ランキング 表彰台 */}
          <div style={sec}>
            <h3 className="font-black text-white mb-1">🏆 みなと未来党 班別ランキング</h3>
            <p className="text-xs mb-5" style={{ color:"rgba(255,255,255,0.4)" }}>全3選挙区の平均得票率で順位決定</p>

            {/* 表彰台 */}
            <div className="flex items-end justify-center gap-2 mb-5" style={{ height:"160px" }}>
              {[0,1,2].map(podiumPos => {
                const item = podiumOrder[podiumPos]; // center=1st
                const rank = podiumPos === 1 ? 0 : podiumPos === 0 ? 1 : 2; // map to rank index
                const h = podiumPos === 1 ? 130 : podiumPos === 0 ? 95 : 70;
                const color = podiumColors[rank];
                const label = podiumLabels[rank];
                if (!item) return <div key={podiumPos} style={{ flex:1 }} />;
                return (
                  <div key={podiumPos} className="flex-1 flex flex-col items-center justify-end">
                    <p className="text-xs font-bold mb-1" style={{ color:"rgba(255,255,255,0.7)" }}>{item.team.name}</p>
                    <p className="text-sm font-black" style={{ color:"#FCD34D" }}>{item.avgRate.toFixed(1)}%</p>
                    <div className="w-full flex items-center justify-center rounded-t-lg mt-1"
                      style={{ height:`${h}px`, background:color, boxShadow:`0 0 20px ${color}60` }}>
                      <span className="font-black text-white" style={{ fontSize:podiumPos===1?"28px":"22px" }}>{label}</span>
                    </div>
                  </div>

            {/* 4〜10位リスト */}

                <span className="text-sm" style={{ color:"rgba(255,255,255,0.55)" }}>{i+4}. {item.team.name}</span>
                <span className="font-bold text-sm" style={{ color:"rgba(255,255,255,0.4)" }}>{item.avgRate.toFixed(1)}%</span>
              </div>
            ))}

            {/* 1〜3位の戦略メモ */}
            <div className="mt-4">
              <p className="text-xs font-bold mb-2" style={{ color:"rgba(255,255,255,0.5)" }}>上位3班の戦略メモ</p>
              {teamRankings.slice(0,3).map((item, i) => item.team.strategy.memo && (
                <div key={item.team.id} className="rounded-lg p-3 mb-2"
                  style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)" }}>
                  <p className="text-xs font-bold mb-1" style={{ color:["#EAB308","#94A3B8","#CD7F32"][i] }}>

    function App() {
      const [currentScreen, setCurrentScreen] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get("teacher") === "1") return "teacher";
        return localStorage.getItem("election_team_id") ? "scenario" : "teamSelect";
      });
      const [teamId, setTeamId] = useState(() => Number(localStorage.getItem("election_team_id")) || null);
      const [teams, setTeams] = useState(INITIAL_TEAMS);
      const [activeEvents, setActiveEvents] = useState([]);
      const [revealedDistrict, setRevealedDistrict] = useState(0);
      const [gamePhase, setGamePhase] = useState("waiting");
      const [teacherUnlocked, setTeacherUnlocked] = useState(() => {
        return new URLSearchParams(window.location.search).get("teacher") === "1";
      });
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [timerRunning, setTimerRunning] = useState(false);

      useEffect(() => {
        if (!timerRunning) return;
        const id = setInterval(() => {
          setTimerSeconds(s => { if (s <= 0) { setTimerRunning(false); return 0; } return s - 1; });
        }, 1000);
        return () => clearInterval(id);
      }, [timerRunning]);

      const navigate = useCallback((screen) => setCurrentScreen(screen), []);
      const currentTeam = teams.find(t => t.id === teamId) || teams[0];

      function handleTeamSelect(id) {
        localStorage.setItem("election_team_id", String(id));
        setTeamId(id);
        navigate("scenario");
      }

      function handleSaveAndNext(strategy) {
        setTeams(prev => prev.map(t => t.id === teamId ? { ...t, strategy } : t));
        navigate("confirm");
      }

      function handleSubmit() {
        setTeams(prev => prev.map(t => t.id === teamId ? { ...t, submitted:true } : t));
        navigate("submitted");
      }

      function handleTeacherButton() {
        if (currentScreen === "teacher") { navigate("scenario"); return; }
        if (teacherUnlocked) { navigate("teacher"); }
        else { setShowPasswordModal(true); }
      }

      function startTimer(minutes) {
        setTimerSeconds(minutes * 60);
        setTimerRunning(true);
      }

      function handleReset() {
        if (!window.confirm("全データをリセットしますか？\n班の提出データ・イベント・発表状況がすべてクリアされます。\nこの操作は元に戻せません。")) return;
        setTeams(INITIAL_TEAMS);
        setActiveEvents([]);
        setRevealedDistrict(0);
        setGamePhase("waiting");
        setTimerSeconds(0);
        setTimerRunning(false);
        localStorage.removeItem("election_team_id");
        setTeamId(null);
        setCurrentScreen("teamSelect");
      }

      const DEV_SCREENS = ["teamSelect","scenario","strategy","confirm","submitted","results_district","dontMethod","results_final","teacher"];

      function renderScreen() {
        switch (currentScreen) {
          case "teamSelect":         return <TeamSelectScreen savedTeamId={teamId} onSelect={handleTeamSelect} />;
          case "scenario":           return <ScenarioScreen onNext={() => navigate("strategy")} gamePhase={gamePhase} />;
          case "strategy":           return <StrategyScreen team={currentTeam} activeEvents={activeEvents} onSaveAndNext={handleSaveAndNext} />;
          case "confirm":            return <ConfirmScreen team={currentTeam} onSubmit={handleSubmit} onBack={() => navigate("strategy")} />;
          case "submitted":          return <SubmittedScreen team={currentTeam} />;
          case "results_district":   return (
            <DistrictResultsScreen teams={teams} activeEvents={activeEvents}
              revealedDistrict={revealedDistrict}
              onReveal={() => setRevealedDistrict(r => Math.min(r+1, 3))}
              onNext={() => navigate("dontMethod")} />
          );
          case "dontMethod":         return <DontMethodScreen teams={teams} activeEvents={activeEvents} onNext={() => navigate("results_final")} />;
          case "results_final":      return <FinalResultsScreen teams={teams} activeEvents={activeEvents} />;
          case "teacher":            return (
            <TeacherScreen teams={teams} activeEvents={activeEvents}
              setActiveEvents={setActiveEvents} gamePhase={gamePhase} setGamePhase={setGamePhase}
              revealedDistrict={revealedDistrict} setRevealedDistrict={setRevealedDistrict}
              navigate={navigate} timerSeconds={timerSeconds} startTimer={startTimer}
              onReset={handleReset} />
          );
          default: return null;
        }
      }

      return (
        <div className="min-h-screen flex flex-col" style={{ background:"#1E3A5F", color:"white" }}>
          {showPasswordModal && (
            <PasswordModal
              onSuccess={() => { setTeacherUnlocked(true); setShowPasswordModal(false); navigate("teacher"); }}
              onCancel={() => setShowPasswordModal(false)} />
          )}
          <header className="flex items-center justify-between px-4 py-2 no-print"
            style={{ borderBottom:"1px solid rgba(255,255,255,0.08)", background:"rgba(0,0,0,0.3)" }}>
            <div>
              <p className="text-xs font-bold tracking-widest" style={{ color:"rgba(255,255,255,0.3)" }}>みなと市衆議院選挙シミュレーション</p>
              <p className="font-black text-white text-sm tracking-wide leading-tight">
                選挙コンサルタント疑似体験
                <span className="ml-2 text-xs font-normal" style={{ color:"rgba(255,255,255,0.4)" }}>
                  {SCREEN_LABELS[currentScreen] ?? currentScreen}
                </span>
              </p>
            </div>
            <div className="flex items-center gap-2">
              {gamePhase === "strategy" && timerSeconds > 0 && (
                <div className="text-right hidden sm:block">
                  <p className="text-xs" style={{ color:"rgba(255,255,255,0.35)" }}>戦略入力タイマー</p>
                  <p className={`font-black text-lg leading-none ${timerSeconds<=60?"timer-pulse":""}`}
                    style={{ color:timerSeconds<=60?"#F87171":"#4ADE80", fontFamily:"monospace" }}>
                    {`${String(Math.floor(timerSeconds/60)).padStart(2,"0")}:${String(timerSeconds%60).padStart(2,"0")}`}
                  </p>
                </div>
              )}
              <button onClick={handleTeacherButton}
                className="text-xs font-bold text-white no-print"
                style={{ padding:"6px 12px", borderRadius:"8px",
                  background:currentScreen==="teacher"?"#2563EB":"rgba(255,255,255,0.08)",
                  border:"1px solid rgba(255,255,255,0.15)", cursor:"pointer" }}>
                {currentScreen === "teacher" ? "← 生徒画面へ" : "🔐 教師"}
              </button>
            </div>
          </header>

          <main className="flex-1 flex flex-col px-4 py-5 mx-auto w-full" style={{ maxWidth:"860px" }}>
            {renderScreen()}
          </main>

          <footer className="no-print" style={{ borderTop:"1px solid rgba(255,255,255,0.08)", background:"rgba(0,0,0,0.25)", padding:"10px 16px" }}>
            <p className="text-xs text-center mb-2" style={{ color:"rgba(255,255,255,0.2)" }}>【開発用】画面切り替え</p>
            <div className="flex flex-wrap gap-1.5 justify-center">
              {DEV_SCREENS.map(s => (
                <button key={s} onClick={() => navigate(s)} className="text-xs"
                  style={{
                    padding:"3px 8px", borderRadius:"6px",
                    background:currentScreen===s?"#2563EB":"rgba(255,255,255,0.06)",
                    border:`1px solid ${currentScreen===s?"#2563EB":"rgba(255,255,255,0.1)"}`,
                    color:currentScreen===s?"white":"rgba(255,255,255,0.4)"
                  }}>
                  {SCREEN_LABELS[s]}
                </button>
              ))}
            </div>
          </footer>
        </div>
      );
    }

    window.calculateVoteRate = calculateVoteRate;
    window.calculateAIVoteRate = calculateAIVoteRate;
    window.computeDistrictResult = computeDistrictResult;
    window.computeDhont = computeDhont;
    window.DISTRICTS = DISTRICTS;
    window.PARTIES = PARTIES;
    window.INITIAL_TEAMS = INITIAL_TEAMS;
    window.PROPORTIONAL_VOTES = PROPORTIONAL_VOTES;

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
