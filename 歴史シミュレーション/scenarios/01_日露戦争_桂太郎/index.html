<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂太郎と日露戦争の選択</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #ede4cc;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(150,110,40,.035) 38px, rgba(150,110,40,.035) 39px),
    radial-gradient(ellipse 120% 50% at 50% -5%, rgba(200,168,75,.12) 0%, transparent 100%);
  color: #1e1208;
  font-family: '游明朝','YuMincho','Hiragino Mincho ProN','Georgia',serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#app { max-width: 1080px; width: 100%; min-height: 100vh; padding: 0 24px 80px; }

.page-enter { animation: pageIn .4s ease both; }
@keyframes pageIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── Fullscreen ── */
#fsBtn {
  position: fixed; top: 14px; right: 16px;
  background: rgba(30,18,8,.82); border: 1px solid #c8a84b66; color: #c8a84b;
  width: 36px; height: 36px; border-radius: 4px; cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  z-index: 200; transition: all .2s; backdrop-filter: blur(4px);
}
#fsBtn:hover { background: #c8a84b; color: #1e1208; }

/* ── Click hint ── */
#clickHint {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: #c8a84baa; letter-spacing: 3px;
  pointer-events: none; z-index: 100; opacity: 0; transition: opacity .4s; white-space: nowrap;
}
#clickHint.show { opacity: 1; animation: hintP 2.5s ease infinite; }
@keyframes hintP { 0%,100%{opacity:.5} 50%{opacity:1} }

/* ── Header / Timeline ── */
.game-header { text-align: center; padding: 22px 0 10px; border-bottom: 1px solid #c8a84b44; margin-bottom: 14px; }
.game-label { font-size: 12px; color: #907850; letter-spacing: 5px; }
.timeline { display: flex; justify-content: space-between; padding: 10px 0 6px; margin-bottom: 22px; font-size: 12px; gap: 4px; }
.tl-item { flex: 1; text-align: center; color: #a09060; white-space: nowrap; padding: 6px 2px; border-bottom: 2px solid #c8c080; transition: all .3s; }
.tl-item.past  { color: #604020; border-color: #907040; }
.tl-item.active{ color: #8b2020; border-color: #8b2020; font-weight: bold; }

/* ── Scene header ── */
.scene-header {
  display: grid; grid-template-columns: max-content 1fr;
  overflow: hidden; margin-bottom: 18px;
  box-shadow: 0 4px 16px rgba(42,26,10,.22);
  border-radius: 3px;
}
.scene-year {
  background: #c8a84b; color: #1a0800;
  padding: 0 22px; font-size: 13px; font-weight: bold; letter-spacing: 1px;
  display: flex; align-items: center; justify-content: center;
  white-space: nowrap; min-width: 120px; text-align: center; line-height: 1.5;
}
.scene-title {
  background: #2a1a0a; color: #f0e6d0;
  font-size: 22px; font-weight: bold; letter-spacing: 1px;
  padding: 18px 26px; display: flex; align-items: center;
}

/* ── VN scene wrapper ── */
.vn-scene {
  border: 1px solid #c8a84b44; border-radius: 4px; overflow: hidden;
  margin-bottom: 16px; box-shadow: 0 4px 24px rgba(42,26,10,.18);
}

/* ── Stage (kept dark for drama) ── */
.vn-stage {
  height: 420px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #080504 0%, #140c06 50%, #201008 100%);
  display: flex; align-items: flex-end; justify-content: center;
}
.vn-stage::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 70% at 50% 90%, rgba(200,168,75,.08) 0%, transparent 70%);
}
.vn-stage::after {
  content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 140px; height: 18px; background: rgba(0,0,0,.65); border-radius: 50%; filter: blur(12px);
}

/* ── Character photo / silhouette ── */
.vn-char {
  position: relative; z-index: 2;
  height: 398px; display: flex; align-items: flex-end; justify-content: center;
  transition: opacity .35s ease, transform .35s ease;
}
.vn-char.out { opacity: 0; transform: translateY(18px); }

.char-photo {
  height: 380px; width: auto; max-width: 280px;
  object-fit: cover; object-position: top center;
  filter: sepia(18%) contrast(1.07) brightness(0.9);
  border: 2px solid #c8a84b55; border-bottom: none; border-radius: 3px 3px 0 0;
  box-shadow: 0 0 60px rgba(0,0,0,.92), 0 4px 20px rgba(0,0,0,.7);
  display: block;
}
.char-silhouette { height: 370px; width: 160px; display: flex; align-items: flex-end; justify-content: center; }
.char-silhouette svg { height: 350px; width: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.5)); }

/* ── Status overlay (shown inside stage) ── */
.vn-status-overlay {
  position: absolute; inset: 0; z-index: 4;
  background: linear-gradient(135deg, rgba(14,8,2,.92) 0%, rgba(20,10,4,.90) 100%);
  border-left: 4px solid #c8a84b;
  display: flex; flex-direction: column; justify-content: center; padding: 24px 32px;
  animation: fadeIn .3s ease both;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.vso-title {
  font-size: 12px; color: #c8a84b; letter-spacing: 4px; margin-bottom: 18px;
  padding-bottom: 12px; border-bottom: 1px solid #c8a84b55;
}
.vso-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 32px;
  align-content: start;
}
.vso-item {
  font-size: 16px; color: #e0d0b0; padding: 6px 0 6px 22px;
  position: relative; line-height: 1.65;
}
.vso-item::before { content: '◆'; position: absolute; left: 0; color: #c8a84b; font-size: 10px; top: 9px; }
@media (max-width: 620px) { .vso-grid { grid-template-columns: 1fr; } }

/* ── Dialogue box — parchment ── */
.vn-box {
  background:
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(150,110,40,.035) 39px, rgba(150,110,40,.035) 40px),
    linear-gradient(180deg, #f5ead2 0%, #ecddc0 60%, #e6d6ae 100%);
  border-top: none;
  padding: 0 32px 28px; min-height: 160px; position: relative; cursor: pointer;
  box-shadow: inset 0 16px 24px rgba(0,0,0,.05);
}
.vn-box::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, transparent 0%, #c8a84b 8%, #8b2020 28%, #c8a84b 50%, #8b2020 72%, #c8a84b 92%, transparent 100%);
}
.vn-box::after {
  content: '❧';
  position: absolute; bottom: 18px; right: 52px;
  color: rgba(140,100,30,.18); font-size: 26px; pointer-events: none;
}
.vn-name {
  display: inline-block; font-size: 16px; font-weight: bold; letter-spacing: 2px;
  padding: 12px 40px 12px 24px; margin-bottom: 16px;
  background: linear-gradient(135deg, #1e1208 0%, #2e1c0c 100%);
  color: #f0e6d0;
  border-left: 3px solid #c8a84b;
  clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 100%, 0 100%);
  box-shadow: 4px 4px 14px rgba(0,0,0,.4);
  text-shadow: 0 1px 4px rgba(0,0,0,.6);
}
.vn-name.hidden { display: none; }
.vn-text { font-size: 19px; line-height: 2.0; color: #1e1208; min-height: 72px; padding: 0 4px; }
.vn-text em { color: #8b2020; font-style: normal; font-weight: bold; }
.vn-arrow { position: absolute; bottom: 16px; right: 26px; font-size: 16px; color: #c8a84b; animation: arrowBob 1.6s ease infinite; }
.vn-arrow.pause { animation: none; opacity: .3; }
.vn-arrow.hidden { display: none; }
@keyframes arrowBob { 0%,100%{transform:translateY(0);opacity:.6} 50%{transform:translateY(5px);opacity:1} }

/* ── Continue button ── */
.continue-btn {
  display: block; width: 100%; background: #2a1a0a; border: 1px solid #c8a84b; color: #c8a84b;
  padding: 14px; font-family: inherit; font-size: 14px; cursor: pointer; letter-spacing: 3px;
  border-radius: 3px; transition: background .15s, color .15s, opacity .5s; margin-bottom: 40px;
}
.continue-btn:hover { background: #c8a84b; color: #1e1208; }
.continue-btn.hidden-btn { opacity: 0; pointer-events: none; }

/* ── Decision ── */
.decision-tag { display: inline-block; background: #8b2020; color: #faf6ec; padding: 5px 16px; font-size: 12px; letter-spacing: 2px; border-radius: 2px; margin-bottom: 16px; }
.decision-context {
  font-size: 19px; color: #1e1208; margin-bottom: 22px; line-height: 1.85; padding: 20px 28px;
  background: #faf6ec; border-left: 5px solid #c8a84b; box-shadow: 0 3px 12px rgba(42,26,10,.08);
  border-radius: 0 3px 3px 0;
}
.choices { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.choice-btn {
  background: #faf6ec; border: 1px solid #c8a84b88; color: #1e1208;
  padding: 18px 22px 18px 62px; text-align: left; cursor: pointer;
  font-family: inherit; font-size: 17px; line-height: 1.75; border-radius: 3px; position: relative;
  opacity: 0; transform: translateX(-14px);
  transition: opacity .35s ease, transform .35s ease, background .15s, border-color .15s, box-shadow .15s;
  box-shadow: 0 2px 8px rgba(42,26,10,.07);
}
.choice-btn.in { opacity: 1; transform: translateX(0); }
.choice-btn.in:hover { background: #fff8e6; border-color: #c8a84b; transform: translateX(5px); box-shadow: 0 5px 18px rgba(42,26,10,.14); }
.choice-btn::before {
  content: attr(data-label);
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 32px; height: 32px;
  background: #8b2020; color: #faf6ec;
  border-radius: 50%; font-weight: bold; font-size: 15px;
  line-height: 32px; text-align: center;
}
.choice-btn[data-label="B"]::before { background: #1a3060; }
.choice-btn[data-label="C"]::before { background: #1a5a28; }
.keyboard-hint { text-align: center; font-size: 12px; color: #907850; letter-spacing: 2px; margin-bottom: 20px; opacity: 0; animation: fadeHint .5s ease 1.2s forwards; }
@keyframes fadeHint { to{opacity:1} }

/* ── Timer ── */
.timer-area {
  display: flex; align-items: center; gap: 16px; padding: 14px 18px; margin-bottom: 18px;
  background: #faf6ec; border: 1px solid #c8a84b55; border-radius: 4px; box-shadow: 0 2px 8px rgba(42,26,10,.06);
}
.timer-circle { position: relative; width: 64px; height: 64px; cursor: pointer; flex-shrink: 0; }
.timer-ring { width: 64px; height: 64px; display: block; }
.timer-bg { fill: none; stroke: #ddd0a0; stroke-width: 5; }
.timer-progress { fill: none; stroke: #8b2020; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 138.23; stroke-dashoffset: 0; transition: stroke-dashoffset .9s linear; transform-origin: 32px 32px; transform: rotate(-90deg); }
.timer-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.timer-min { font-size: 14px; color: #8b2020; font-weight: bold; line-height: 1; }
.timer-sub { font-size: 8px; color: #907850; letter-spacing: 1px; margin-top: 3px; }
.timer-desc { flex: 1; }
.timer-desc-title { font-size: 12px; color: #2a1a08; letter-spacing: 1px; margin-bottom: 4px; font-weight: bold; }
.timer-desc-hint { font-size: 11px; color: #907850; }
.timer-reset-btn { background: transparent; border: 1px solid #c8a84b; color: #907850; padding: 6px 14px; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 12px; letter-spacing: 1px; transition: all .15s; }
.timer-reset-btn:hover { border-color: #8b2020; color: #8b2020; }
.timer-circle.paused .timer-progress { stroke: #b0a070; }
.timer-circle.paused .timer-min { color: #b0a070; }
.timer-circle.warning .timer-min { color: #c03020; animation: blink 1s ease infinite; }
.timer-circle.done .timer-progress { stroke: #d8cc90; }
.timer-circle.done .timer-min { color: #907850; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Result ── */
/* あなたの選択（小さめ・薄い） */
.result-your {
  background: #f0f4f8; border: 1px solid #b0c4de; border-radius: 3px;
  padding: 12px 18px; margin-bottom: 10px;
}
.result-your-label { font-size: 11px; letter-spacing: 2px; margin-bottom: 7px; color: #4a6090; }
.result-your-text { font-size: 16px; color: #2a3850; line-height: 1.7; margin-bottom: 7px; }
.result-consequence { font-size: 15px; color: #3a4060; line-height: 1.85; }

/* 一致 / 不一致バナー */
.match-banner {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 24px; margin-bottom: 20px; border-radius: 3px; font-size: 17px; font-weight: bold; letter-spacing: 1px;
}
.match-banner.match    { background: #e4f5ea; color: #1a5a28; border: 1px solid #3a9048; }
.match-banner.mismatch { background: #fdf5e2; color: #6a4010; border: 1px solid #c09030; }
.match-icon { font-size: 22px; flex-shrink: 0; }

/* 桂太郎の実際の判断（最重要・最大） */
.result-katsura {
  border-radius: 4px; overflow: hidden; margin-bottom: 22px;
  box-shadow: 0 6px 28px rgba(30,100,50,.15);
  border: 2px solid #1a7030;
}
.result-katsura.is-match { border-color: #1a5a28; }
.result-katsura-header {
  background: linear-gradient(135deg, #1a5a28 0%, #2a8040 100%);
  padding: 14px 24px; display: flex; align-items: center; gap: 14px;
}
.result-katsura-tag {
  font-size: 10px; color: #a0f0c0; letter-spacing: 2px; border: 1px solid #a0f0c055;
  padding: 3px 10px; border-radius: 2px; flex-shrink: 0;
}
.result-katsura-title { font-size: 15px; color: #e8fff2; font-weight: bold; letter-spacing: 1px; }
.result-katsura-choice {
  font-size: 21px; font-weight: bold; color: #1a3020;
  padding: 22px 28px 16px; border-bottom: 1px solid #a0d8b0; line-height: 1.6;
  background: #f4fdf6;
}
.result-katsura-choice::before { content: '「'; }
.result-katsura-choice::after  { content: '」'; }
.result-katsura-why {
  font-size: 11px; color: #3a7850; letter-spacing: 2px; padding: 16px 28px 4px;
  background: #f4fdf6;
}
.result-katsura-body {
  font-size: 16px; line-height: 2; color: #1a2a1a; padding: 6px 28px 24px;
  background: #f4fdf6;
}
.result-katsura-body p { margin-bottom: .8em; }
.result-katsura-body p:last-child { margin-bottom: 0; }
.result-katsura-sub { color: #4a7855; font-size: 14px; }

/* 旧クラス（互換用・非表示） */
.result-player { display: none; }
.result-label { display: none; }
.result-player-text { display: none; }
.divider { border: none; border-top: 1px solid #c8a84b44; margin: 18px 0; }
.match-indicator { display: none; }
.result-history { display: none; }
.result-history-label, .result-history-choice, .result-history-text, .result-history-sub { display: none; }

/* ── Title ── */
.title-screen { text-align: center; padding: 50px 20px 60px; }
.title-deco { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }
.title-deco-line { flex: 1; max-width: 80px; height: 1px; background: linear-gradient(90deg, transparent, #c8a84b); }
.title-deco-line:last-child { background: linear-gradient(90deg, #c8a84b, transparent); }
.title-kamon { font-size: 24px; color: #8b2020; opacity: .8; }
.title-main { font-size: 30px; line-height: 1.5; margin-bottom: 8px; letter-spacing: 2px; color: #1e1208; }
.title-sub { font-size: 12px; color: #907850; letter-spacing: 6px; margin-bottom: 30px; }
.title-portrait-wrap {
  width: 110px; margin: 0 auto 26px; overflow: hidden;
  border: 2px solid #c8a84b; border-radius: 2px; box-shadow: 0 6px 24px rgba(42,26,10,.25);
}
.title-portrait-wrap img { width: 100%; display: block; filter: sepia(18%) contrast(1.04); }
.title-desc {
  font-size: 14px; color: #2a1a08; line-height: 2; max-width: 520px; margin: 0 auto 16px;
  text-align: left; background: #faf6ec; padding: 20px 24px;
  border: 1px solid #c8a84b44; border-radius: 3px; box-shadow: 0 2px 8px rgba(42,26,10,.07);
}
.title-note { font-size: 11px; color: #907850; margin-bottom: 36px; line-height: 2; }
.start-btn {
  background: #2a1a0a; border: 1px solid #c8a84b; color: #c8a84b;
  padding: 15px 60px; font-family: inherit; font-size: 15px; cursor: pointer;
  letter-spacing: 5px; border-radius: 2px; transition: all .2s;
}
.start-btn:hover { background: #c8a84b; color: #1e1208; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(200,168,75,.3); }

/* ── Ending ── */
.ending-section { margin-bottom: 28px; }
.ending-section-title { font-size: 11px; color: #8b2020; letter-spacing: 3px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #8b202044; }
.narration { background: #faf6ec; border: 1px solid #c8a84b44; padding: 26px 32px; margin-bottom: 18px; line-height: 2.2; font-size: 18px; color: #1e1208; border-radius: 2px; }
.narration p { margin-bottom: 1em; }
.narration p:last-child { margin-bottom: 0; }
.emphasis { color: #8b2020; font-weight: bold; }
.score-display { text-align: center; padding: 32px; margin-bottom: 20px; background: #faf6ec; border: 1px solid #c8a84b55; border-radius: 3px; }
.score-num   { font-size: 56px; color: #8b2020; font-weight: bold; }
.score-denom { font-size: 28px; color: #907850; }
.score-label { font-size: 12px; color: #907850; margin-top: 6px; letter-spacing: 1px; }
.score-eval  { font-size: 15px; color: #2a1a08; margin-top: 12px; line-height: 1.85; }
.choice-record { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid #e0d0a8; font-size: 13px; }
.choice-record:last-child { border-bottom: none; }
.record-badge { flex-shrink: 0; font-size: 11px; padding: 2px 10px; border-radius: 2px; margin-top: 2px; }
.record-badge.match   { background: #ecf8ef; color: #1a6030; border: 1px solid #40a050; }
.record-badge.mismatch{ background: #fdf6e4; color: #704810; border: 1px solid #c09040; }
.record-decision { font-size: 11px; color: #907850; margin-bottom: 3px; }
.record-text { color: #1e1208; }
/* ── 歴史的概念カード（ending） ── */
.concept-intro {
  font-size: 16px; color: #3a2a10; line-height: 1.9; padding: 18px 26px;
  background: #faf6ec; border-left: 5px solid #8b2020; margin-bottom: 20px; border-radius: 0 3px 3px 0;
}
.concept-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 8px;
}
.concept-card {
  background: #faf6ec; border: 1px solid #c8a84b55; border-top: 4px solid #8b2020;
  border-radius: 3px; padding: 22px 24px;
  box-shadow: 0 3px 14px rgba(42,26,10,.09);
}
.concept-card:nth-child(2) { border-top-color: #1a6030; }
.concept-card:nth-child(3) { border-top-color: #1a3060; }
.concept-card:nth-child(4) { border-top-color: #7a5010; }
.concept-tag { font-size: 10px; letter-spacing: 2px; color: #8b2020; margin-bottom: 8px; }
.concept-card:nth-child(2) .concept-tag { color: #1a6030; }
.concept-card:nth-child(3) .concept-tag { color: #1a3060; }
.concept-card:nth-child(4) .concept-tag { color: #7a5010; }
.concept-title { font-size: 18px; font-weight: bold; color: #1e1208; margin-bottom: 12px; line-height: 1.4; }
.concept-body { font-size: 14px; color: #3a2a10; line-height: 1.9; }
@media (max-width: 560px) { .concept-grid { grid-template-columns: 1fr; } }

/* ── Score big display ── */
.score-display {
  text-align: center; padding: 32px; margin-bottom: 20px;
  background: #faf6ec; border: 1px solid #c8a84b55; border-radius: 3px;
  display: grid; grid-template-columns: auto 1fr; gap: 0 28px; align-items: center;
  text-align: left;
}
.score-num-wrap { text-align: center; }
.score-eval  { font-size: 15px; color: #2a1a08; line-height: 1.85; }
.restart-btn { display: block; width: 100%; background: transparent; border: 1px solid #c8a84b; color: #907850; padding: 13px; font-family: inherit; font-size: 13px; cursor: pointer; letter-spacing: 3px; border-radius: 3px; transition: all .15s; margin-top: 20px; margin-bottom: 60px; }
.restart-btn:hover { background: #2a1a0a; color: #c8a84b; border-color: #c8a84b; }

/* ── Photo credit ── */
.photo-credit { font-size: 9px; color: #a09070; text-align: right; padding: 4px 6px; background: #2a1a0a; letter-spacing: 1px; opacity: .7; }
.page-footer { text-align: center; padding: 14px 0; font-size: 10px; color: #a09070; letter-spacing: 1px; border-top: 1px solid #c8a84b33; margin-top: 20px; }
</style>
</head>
<body>
<button id="fsBtn" onclick="toggleFullscreen()" title="全画面 (F)">⛶</button>
<div id="clickHint">▼ クリック または スペース</div>
<div id="app"></div>

<script>
// ================================================================
// CHARACTERS — Historical photos (Wikimedia Commons, Public Domain)
// ================================================================

let vn = { lines:[], idx:0, active:false, passageNext:'' };

function buildCharHTML(char) {
  if (!char) return '';
  if (char.photo) {
    return `<img class="char-photo" src="${char.photo}" alt="${char.name}" onerror="this.style.display='none'">`;
  }
  return `<div class="char-silhouette">${SILHOUETTE_SVG}</div>`;
}

function startVN(p) {
  vn.lines = p.lines;
  vn.idx = 0;
  vn.active = true;
  vn.passageNext = p.next;
  showVNLine();
  showClickHint();
}

function showVNLine() {
  if (vn.idx >= vn.lines.length) { endVN(); return; }
  const line = vn.lines[vn.idx];
  const charEl  = document.getElementById('vnChar');
  const nameEl  = document.getElementById('vnName');
  const textEl  = document.getElementById('vnText');
  const arrowEl = document.getElementById('vnArrow');
  const stageEl = document.getElementById('vnStage');

  const oldOv = stageEl ? stageEl.querySelector('.vn-status-overlay') : null;
  if (oldOv) oldOv.remove();

  // Status line
  if (line.type === 'status') {
    if (charEl) charEl.classList.add('out');
    if (nameEl) nameEl.className = 'vn-name hidden';
    if (textEl) textEl.textContent = '';
    if (stageEl) {
      const ov = document.createElement('div');
      ov.className = 'vn-status-overlay';
      ov.innerHTML = `<div class="vso-title">${line.title}</div>` +
        `<div class="vso-grid">` +
        line.items.map(i => `<div class="vso-item">${i}</div>`).join('') +
        `</div>`;
      stageEl.appendChild(ov);
    }
    if (arrowEl) arrowEl.className = 'vn-arrow';
    return;
  }

  // Normal dialogue
  const char = line.speaker ? CHARS[line.speaker] : null;

  if (charEl) {
    if (char) {
      if (charEl.dataset.speaker !== line.speaker) {
        charEl.dataset.speaker = line.speaker;
        charEl.classList.add('out');
        setTimeout(() => {
          charEl.innerHTML = buildCharHTML(char);
          charEl.classList.remove('out');
        }, 220);
      } else {
        charEl.classList.remove('out');
      }
    } else {
      charEl.classList.add('out');
      charEl.dataset.speaker = '';
    }
  }

  if (nameEl) {
    if (char) {
      nameEl.className = 'vn-name';
      nameEl.textContent = char.name;
      nameEl.style.background = char.color || '#2a1a0a';
      nameEl.style.color = '#f0e6d0';
    } else {
      nameEl.className = 'vn-name hidden';
    }
  }

  if (textEl) startTyping(textEl, line.text);
  if (arrowEl) arrowEl.className = 'vn-arrow pause';
}

function advanceVN() {
  if (!vn.active) return;
  if (isTyping()) { skipTyping(); return; }
  const arrowEl = document.getElementById('vnArrow');
  if (arrowEl) arrowEl.className = 'vn-arrow';
  vn.idx++;
  showVNLine();
}

function endVN() {
  vn.active = false;
  hideClickHint();
  const btn = document.getElementById('vnNextBtn');
  if (btn) btn.classList.remove('hidden-btn');
  const arrowEl = document.getElementById('vnArrow');
  if (arrowEl) arrowEl.className = 'vn-arrow hidden';
}

// ================================================================
// TYPEWRITER
// ================================================================
const TYPE = { timer:null, el:null, fullHtml:'', plain:'', idx:0 };
const TYPE_SPEED = 36;

function startTyping(el, html) {
  clearInterval(TYPE.timer);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  TYPE.plain = tmp.textContent;
  TYPE.fullHtml = html;
  TYPE.el = el;
  TYPE.idx = 0;
  el.textContent = '';
  TYPE.timer = setInterval(() => {
    TYPE.idx++;
    if (TYPE.idx >= TYPE.plain.length) {
      clearInterval(TYPE.timer);
      TYPE.timer = null;
      el.innerHTML = TYPE.fullHtml;
      const arrowEl = document.getElementById('vnArrow');
      if (arrowEl) arrowEl.className = 'vn-arrow';
    } else {
      el.textContent = TYPE.plain.substring(0, TYPE.idx);
    }
  }, TYPE_SPEED);
}

function skipTyping() {
  if (!TYPE.timer) return;
  clearInterval(TYPE.timer);
  TYPE.timer = null;
  if (TYPE.el) TYPE.el.innerHTML = TYPE.fullHtml;
  const arrowEl = document.getElementById('vnArrow');
  if (arrowEl) arrowEl.className = 'vn-arrow';
}
function isTyping() { return !!TYPE.timer; }

// TIMER
// ================================================================
const TIMER_TOTAL = 60;
const CIRC = 2 * Math.PI * 22;
let timerState = { remaining:TIMER_TOTAL, paused:false, id:null };

function startTimer() {
  clearInterval(timerState.id);
  timerState.remaining = TIMER_TOTAL;
  timerState.paused = false;
  timerState.id = setInterval(() => {
    if (timerState.paused) return;
    timerState.remaining = Math.max(0, timerState.remaining - 1);
    renderTimer();
    if (timerState.remaining === 0) {
      clearInterval(timerState.id);
      const el = document.getElementById('timerCircle');
      if (el) el.classList.add('done');
    }
  }, 1000);
  renderTimer();
}
function stopTimer() { clearInterval(timerState.id); timerState.id = null; }
function toggleTimerPause() {
  timerState.paused = !timerState.paused;
  const el = document.getElementById('timerCircle');
  if (el) el.classList.toggle('paused', timerState.paused);
}
function resetTimerBtn(e) { if (e) e.stopPropagation(); stopTimer(); startTimer(); }
function renderTimer() {
  const el = document.getElementById('timerCircle'); if (!el) return;
  const m = Math.floor(timerState.remaining / 60), s = timerState.remaining % 60;
  const t = el.querySelector('.timer-min'); if (t) t.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const ring = el.querySelector('.timer-progress'); if (ring) ring.style.strokeDashoffset = CIRC * (1 - timerState.remaining / TIMER_TOTAL);
  el.classList.toggle('warning', timerState.remaining > 0 && timerState.remaining <= 30);
}

// ================================================================
// FULLSCREEN / HINTS
// ================================================================
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}
function showClickHint() { document.getElementById('clickHint').classList.add('show'); }
function hideClickHint() { document.getElementById('clickHint').classList.remove('show'); }

// ================================================================
// KEYBOARD + CLICK
// ================================================================
document.addEventListener('click', e => {
  if (e.target.closest('button, a')) return;
  if (vn.active) advanceVN();
});
document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && vn.active) { e.preventDefault(); advanceVN(); return; }
  const p = P[S.passage];
  if (p && p.type === 'decision' && !S.showResult) {
    const map = {a:0,A:0,'1':0,b:1,B:1,'2':1,c:2,C:2,'3':2};
    if (e.key in map && map[e.key] < p.choices.length) choose(map[e.key]);
  }
});

// ================================================================
// RENDER
// ================================================================
function triggerAnim() {
  const app = document.getElementById('app');
  app.classList.remove('page-enter');
  void app.offsetWidth;
  app.classList.add('page-enter');
}

function render() {
  stopTimer();
  hideClickHint();
  clearInterval(TYPE.timer); TYPE.timer = null;
  vn.active = false;
  const app = document.getElementById('app');
  const id = S.passage;

  if (id === 'title')  { app.innerHTML = renderTitle();  triggerAnim(); return; }
  if (id === 'ending') { app.innerHTML = renderEnding(); triggerAnim(); window.scrollTo(0,0); return; }

  const p = P[id];
  if (!p) return;

  if (p.type === 'story') {
    app.innerHTML = renderStory(p);
    triggerAnim();
    window.scrollTo(0,0);
    startVN(p);
  }
  if (p.type === 'decision') {
    app.innerHTML = S.showResult ? renderResult(p) : renderDecision(p);
    triggerAnim();
    window.scrollTo(0,0);
    if (!S.showResult) {
      startTimer();
      setTimeout(() => {
        document.querySelectorAll('.choice-btn').forEach((btn, i) => {
          setTimeout(() => btn.classList.add('in'), i * 160);
        });
      }, 100);
    }
  }
}

function header(tl) {
  const items = TL.map((t, i) => {
    const cls = i < tl ? 'past' : i === tl ? 'active' : '';
    return `<div class="tl-item ${cls}">${t.replace('\n','<br>')}</div>`;
  }).join('');
  return `<div class="game-header"><div class="game-label">歴史シミュレーション</div></div><div class="timeline">${items}</div>`;
}

function renderTitle() {
  const katsura = CHARS.katsura;
  return `<div class="title-screen">
<div class="title-deco">
  <div class="title-deco-line"></div>
  <div class="title-kamon">⚜</div>
  <div class="title-deco-line"></div>
</div>
<div class="title-main">桂太郎と<br>日露戦争の選択</div>
<div class="title-sub">1901 ─── 1905</div>
<div class="title-portrait-wrap">
  <img src="${katsura.photo}" alt="桂太郎" onerror="this.parentElement.style.display='none'">
</div>
<div class="title-desc">
あなたは内閣総理大臣・<strong>桂太郎</strong>として、明治期最大の国家的危機に臨む。<br>
ロシアとの戦争をめぐる<strong>4つの決断</strong>を、実際の歴史的制約の中で体験しよう。<br><br>
まず自分で選択し、そのあとで桂が実際にどう判断したか──その理由とともに明らかになる。
</div>
<div class="title-note">
【学習のポイント】正解は「桂が選んだ選択肢」ではない。なぜその選択が当時の状況で合理的に見えたかを考えることが目的。<br>
クリック / スペース で台詞を送る　　A B C で選択　　F で全画面
</div>
<button class="start-btn" onclick="gotoPassage('intro')">は じ め る</button>
<div class="page-footer">人物写真：Wikimedia Commons / パブリックドメイン</div>
</div>`;
}

function renderStory(p) {
  return `${header(p.tl)}
<div class="scene-header"><div class="scene-year">${p.year}</div><div class="scene-title">${p.title}</div></div>
<div class="vn-scene">
  <div class="vn-stage" id="vnStage">
    <div class="vn-char out" id="vnChar" data-speaker=""></div>
  </div>
  <div class="photo-credit">写真：Wikimedia Commons / Public Domain</div>
  <div class="vn-box">
    <div class="vn-name hidden" id="vnName"></div>
    <div class="vn-text" id="vnText"></div>
    <div class="vn-arrow" id="vnArrow">▼</div>
  </div>
</div>
<button class="continue-btn hidden-btn" id="vnNextBtn" onclick="gotoPassage('${p.next}')">次の局面へ →</button>`;
}

function renderDecision(p) {
  const ch = p.choices.map((c, i) =>
    `<button class="choice-btn" data-label="${c.label}" onclick="choose(${i})">${c.text}</button>`
  ).join('');
  const kbLabels = p.choices.map(c => c.label).join(' / ');
  return `${header(p.tl)}
<div class="scene-header"><div class="scene-year">${p.year}</div><div class="scene-title">${p.title}</div></div>
<div class="decision-tag">${p.tag}</div>
<div class="decision-context">${p.context}</div>
<div class="timer-area">
  <div class="timer-circle" id="timerCircle" onclick="toggleTimerPause()" title="クリックで一時停止">
    <svg class="timer-ring" viewBox="0 0 64 64"><circle class="timer-bg" cx="32" cy="32" r="22"/><circle class="timer-progress" cx="32" cy="32" r="22"/></svg>
    <div class="timer-overlay"><div class="timer-min">${Math.floor(TIMER_TOTAL/60)}:${String(TIMER_TOTAL%60).padStart(2,'0')}</div><div class="timer-sub">審議</div></div>
  </div>
  <div class="timer-desc"><div class="timer-desc-title">グループ審議タイマー（${TIMER_TOTAL>=60?Math.floor(TIMER_TOTAL/60)+'分':TIMER_TOTAL+'秒'}）</div><div class="timer-desc-hint">クリックで一時停止</div></div>
  <button class="timer-reset-btn" onclick="resetTimerBtn(event)">↺ リセット</button>
</div>
<div class="choices">${ch}</div>
<div class="keyboard-hint">キーボード ${kbLabels} で選択可</div>`;
}

function renderResult(p) {
  const c = S.pendingChoice, isM = c.isH;
  const hist = p.choices.find(x => x.isH);

  const matchBanner = isM
    ? `<div class="match-banner match"><span class="match-icon">✓</span> 桂太郎と同じ選択をしました</div>`
    : `<div class="match-banner mismatch"><span class="match-icon">△</span> 桂太郎の選択とは異なります</div>`;

  const histText = isM ? c.ht : c.ht;
  const bodyHtml = histText.replace(/<p class="result-history-sub">/g, '<p class="result-katsura-sub">');

  return `${header(p.tl)}
<div class="scene-header"><div class="scene-year">${p.year}</div><div class="scene-title">${p.tag} の結果</div></div>

<div class="result-your">
  <div class="result-your-label">あなたの選択</div>
  <div class="result-your-text">「${c.text}」</div>
  <div class="result-consequence">${c.pc}</div>
</div>

${matchBanner}

<div class="result-katsura ${isM ? 'is-match' : ''}">
  <div class="result-katsura-header">
    <span class="result-katsura-tag">${isM ? '史実と一致' : '史実の判断'}</span>
    <div class="result-katsura-title">桂太郎が実際に選んだこと</div>
  </div>
  <div class="result-katsura-choice">${hist.text}</div>
  <div class="result-katsura-why">なぜその選択か？</div>
  <div class="result-katsura-body">${bodyHtml}</div>
</div>

<button class="continue-btn" onclick="next()">次の局面へ →</button>`;
}

function renderEnding() {
  const m = S.matches;
  const evals = [
    'ほとんどの局面で桂と異なる判断をした。現代の知識や価値観が影響したかもしれない。',
    '多くの局面で桂と異なる判断をした。当時の制約がどう選択肢を絞っていたか振り返ろう。',
    '半数の局面で桂と同じ判断をした。判断が分かれた局面の理由を考えてみよう。',
    'おおむね桂の判断と一致した。当時の制約の中での合理性をよく理解している。',
    '桂の論理を完全に追体験した。当時の情報環境・制約の中での判断を深く理解している。'
  ];
  const logHtml = S.log.map(r => `
<div class="choice-record">
  <span class="record-badge ${r.isH ? 'match' : 'mismatch'}">${r.isH ? '一致' : '相違'}</span>
  <div><div class="record-decision">${r.dec}</div><div class="record-text">${r.text}</div></div>
</div>`).join('');

  return `${header(5)}
<div class="scene-header"><div class="scene-year">1905年9月5日</div><div class="scene-title">ポーツマス条約、そして日比谷焼き討ち事件</div></div>
<div class="narration">
<p>条約調印のその日、東京・日比谷では凄まじい暴動が起きた。政府系新聞社・交番が次々と焼かれ、死者も出た。<span class="emphasis">日比谷焼き討ち事件</span>である。</p>
<p>民衆の怒りは一点に集中していた──「<span class="emphasis">勝ったのに、なぜ賠償金がないのか</span>」。桂は戒厳令を布告し、第1次桂内閣はその直後に総辞職した。</p>
</div>

<div class="ending-section"><div class="ending-section-title">▍ なぜこうなったのか</div>
<div class="narration">
<p>桂太郎が「財政的に限界」という事実を国民に伝えることができなかったからである。それを伝えれば──ロシアの継戦派が勢いづく。外債市場が崩壊する。元老・政界の説得が不可能になる。</p>
<p>桂は多くの制約の中で当時として合理的な判断を下し続けた。しかし国民はその事情を知らなかった。「勝利」だけを伝えられ続けた国民は、「負けていないのに賠償金なし」という結果に激怒した。<span class="emphasis">情報が遮断された近代国家</span>の、一つの帰結だった。</p>
</div></div>

<div class="ending-section"><div class="ending-section-title">▍ あなたの選択の記録</div>
<div class="score-display">
  <div class="score-num-wrap">
    <div><span class="score-num">${m}</span><span class="score-denom"> / 4</span></div>
    <div class="score-label" style="text-align:center;margin-top:6px;">桂太郎と同じ選択</div>
  </div>
  <div class="score-eval">${evals[Math.min(m,4)]}</div>
</div>
${logHtml}</div>

<div class="ending-section">
<div class="ending-section-title">▍ この体験を通じて得られる歴史的見方・考え方</div>
<div class="concept-intro">
この4つの概念は、日露戦争だけでなく、あらゆる歴史的判断・現代の政治を分析するための視点として使える。
</div>
<div class="concept-grid">
  <div class="concept-card">
    <div class="concept-tag">歴史的思考の基本</div>
    <div class="concept-title">制約の中の合理性</div>
    <div class="concept-body">政策決定は「当時の情報・財政・国際関係」という制約の中で評価する。現代の後知恵で過去を批判するのではなく、当時の合理性を問うことが歴史的思考の出発点。</div>
  </div>
  <div class="concept-card">
    <div class="concept-tag">政治と情報</div>
    <div class="concept-title">情報の非対称性</div>
    <div class="concept-body">桂は「財政的限界」を国民に伝えられなかった。指導者が「言えない事実」を持つとき、何が起きるか。情報格差が民主政治と国民の判断を歪める構造は、現代にも続く。</div>
  </div>
  <div class="concept-card">
    <div class="concept-tag">多角的視点</div>
    <div class="concept-title">「勝利」の多面性</div>
    <div class="concept-body">日露戦争の「勝利」は、日本・ロシア・朝鮮・国際社会それぞれに異なる意味を持つ。「誰の視点から」「何を基準に」評価するかで、歴史の意味は根本的に変わる。</div>
  </div>
  <div class="concept-card">
    <div class="concept-tag">歴史の構造</div>
    <div class="concept-title">転換点の「機会の窓」</div>
    <div class="concept-body">「シベリア鉄道完成前」という時間的制約が選択肢を絞った。歴史の転換点には行動を可能にする機会と、それを閉じる期限がある。この構造を見抜くことが歴史的判断力。</div>
  </div>
</div>
</div>

<button class="restart-btn" onclick="restart()">もう一度プレイする</button>
<div class="page-footer">人物写真：Wikimedia Commons / パブリックドメイン ─ 教育目的利用</div>`;
}

// ================================================================
// GAME LOGIC
// ================================================================
function gotoPassage(id) { S.passage = id; S.showResult = false; render(); }
function choose(i) {
  const p = P[S.passage], c = p.choices[i];
  S.pendingChoice = c; S.showResult = true;
  if (c.isH) S.matches++;
  S.log.push({ dec: p.tag + ' ' + p.title, text: c.text, isH: c.isH });
  stopTimer(); render();
}
function next() { S.passage = S.pendingChoice.next; S.showResult = false; S.pendingChoice = null; render(); }
function restart() { S = { passage:'title', showResult:false, pendingChoice:null, matches:0, log:[] }; render(); }

render();
</script>
</body>
</html>
