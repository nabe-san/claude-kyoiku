<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桂太郎と日露戦争の選択</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1c1510;
  color: #f0e6d3;
  font-family: '游明朝','YuMincho','Hiragino Mincho ProN','Georgia',serif;
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
}
#app { max-width: 800px; width: 100%; min-height: 100vh; padding: 0 20px 60px; }
.page-enter { animation: pageIn 0.45s ease both; }
@keyframes pageIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* ── Fullscreen btn ── */
#fsBtn {
  position:fixed; top:14px; right:16px;
  background:rgba(28,21,16,.88); border:1px solid #3a2a1a; color:#5a4a3a;
  width:36px; height:36px; border-radius:4px; cursor:pointer; font-size:17px;
  display:flex; align-items:center; justify-content:center;
  z-index:200; transition:all .2s; backdrop-filter:blur(4px);
}
#fsBtn:hover { border-color:#c8a84b; color:#c8a84b; }

/* ── Click hint ── */
#clickHint {
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  font-size:11px; color:#5a4a3a; letter-spacing:3px;
  pointer-events:none; z-index:100; opacity:0; transition:opacity .4s; white-space:nowrap;
}
#clickHint.show { opacity:1; animation:hintP 2.5s ease infinite; }
@keyframes hintP { 0%,100%{opacity:.5} 50%{opacity:1} }

/* ── Header/Timeline ── */
.game-header { text-align:center; padding:20px 0 8px; border-bottom:1px solid #c8a84b33; margin-bottom:16px; }
.game-label { font-size:11px; color:#8a7a6a; letter-spacing:4px; }
.timeline { display:flex; justify-content:space-between; padding:10px 0 4px; margin-bottom:20px; font-size:11px; gap:4px; }
.tl-item { flex:1; text-align:center; color:#4a3a2a; white-space:nowrap; padding:4px 2px; border-bottom:2px solid #2a1a0a; transition:all .3s; }
.tl-item.past  { color:#6a5a4a; border-color:#6a5a4a; }
.tl-item.active{ color:#c8a84b; border-color:#c8a84b; font-weight:bold; }

/* ── Scene header ── */
.scene-header { background:#221812; border-left:3px solid #c8a84b; padding:12px 18px; margin-bottom:16px; }
.scene-year  { font-size:11px; color:#c8a84b; letter-spacing:2px; margin-bottom:4px; }
.scene-title { font-size:20px; font-weight:bold; }

/* ================================================================
   VISUAL NOVEL SCENE
   ================================================================ */
.vn-scene { border:1px solid #2a1a0a; border-radius:4px; overflow:hidden; margin-bottom:16px; }

/* ── Stage ── */
.vn-stage {
  height:230px; position:relative; overflow:hidden;
  background: radial-gradient(ellipse at 50% 100%, #3a2008 0%, #1a0c04 45%, #060302 100%);
  display:flex; align-items:flex-end; justify-content:center;
}
/* warm spotlight glow */
.vn-stage::before {
  content:''; position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
  width:200px; height:280px;
  background:radial-gradient(ellipse at center bottom, rgba(200,168,75,.1) 0%, transparent 65%);
  pointer-events:none;
}
/* floor shadow */
.vn-stage::after {
  content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:90px; height:14px;
  background:rgba(0,0,0,.55); border-radius:50%; filter:blur(8px);
}

/* ── Character sprite ── */
.vn-sprite {
  position:relative; z-index:2;
  transition: opacity .35s ease, transform .35s ease;
}
.vn-sprite svg { display:block; height:200px; width:auto; filter:drop-shadow(0 6px 14px rgba(0,0,0,.7)); }
.vn-sprite.out { opacity:0; transform:translateY(16px); }

/* ── Status overlay (shown on stage when status line) ── */
.vn-status-overlay {
  position:absolute; inset:0; z-index:4;
  background:rgba(6,3,1,.88);
  display:flex; flex-direction:column; justify-content:center;
  padding:18px 24px;
  animation:fadeIn .3s ease both;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.vso-title { font-size:10px; color:#c8a84b; letter-spacing:3px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #c8a84b33; }
.vso-item { font-size:13px; color:#b0a090; padding:3px 0 3px 14px; position:relative; line-height:1.65; }
.vso-item::before { content:'・'; position:absolute; left:0; color:#c8a84b; }

/* ── Dialogue box ── */
.vn-box {
  background:rgba(10,6,2,.97); border-top:1px solid #3a2010;
  padding:14px 22px 20px; min-height:116px; position:relative; cursor:pointer;
}
.vn-name {
  display:inline-block; font-size:13px; font-weight:bold;
  padding:3px 20px 3px 12px; border-radius:2px 0 0 2px; margin-bottom:10px; letter-spacing:1px;
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
}
.vn-name.hidden { display:none; }
.vn-text { font-size:15px; line-height:1.9; color:#f0e6d3; min-height:58px; }
.vn-text em { color:#e8d0a0; font-style:normal; font-weight:bold; }
.vn-arrow {
  position:absolute; bottom:14px; right:22px; font-size:13px; color:#5a4a3a;
  animation:arrowBob 1.6s ease infinite;
}
.vn-arrow.pause { animation:none; opacity:.25; }
@keyframes arrowBob { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(4px);opacity:1} }

/* ── Continue button ── */
.continue-btn {
  display:block; width:100%; background:#1e1610; border:1px solid #c8a84b; color:#c8a84b;
  padding:13px; font-family:inherit; font-size:14px; cursor:pointer; letter-spacing:3px;
  border-radius:3px; transition:background .15s, color .15s, opacity .5s; margin-bottom:40px;
}
.continue-btn:hover { background:#c8a84b; color:#1c1510; }
.continue-btn.hidden-btn { opacity:0; pointer-events:none; }

/* ── Decision ── */
.decision-tag { display:inline-block; background:#c8a84b; color:#1c1510; padding:3px 12px; font-size:11px; letter-spacing:2px; border-radius:2px; margin-bottom:12px; }
.decision-context { font-size:14px; color:#a09080; margin-bottom:18px; line-height:1.7; }
.choices { display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
.choice-btn {
  background:#241a10; border:1px solid #c8a84b55; color:#f0e6d3;
  padding:14px 18px 14px 50px; text-align:left; cursor:pointer;
  font-family:inherit; font-size:14px; line-height:1.65; border-radius:3px; position:relative;
  opacity:0; transform:translateX(-14px);
  transition:opacity .35s ease, transform .35s ease, background .15s, border-color .15s;
}
.choice-btn.in { opacity:1; transform:translateX(0); }
.choice-btn.in:hover { background:#3a2810; border-color:#c8a84b; transform:translateX(3px); }
.choice-btn::before { content:attr(data-label); position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#c8a84b; font-weight:bold; font-size:15px; font-family:serif; }
.keyboard-hint { text-align:center; font-size:11px; color:#4a3a2a; letter-spacing:2px; margin-bottom:20px; opacity:0; animation:fadeHint .5s ease 1.2s forwards; }
@keyframes fadeHint { to{opacity:1} }

/* ── Timer ── */
.timer-area { display:flex; align-items:center; gap:16px; padding:12px 16px; margin-bottom:18px; background:#181208; border:1px solid #2a1a08; border-radius:4px; }
.timer-circle { position:relative; width:64px; height:64px; cursor:pointer; flex-shrink:0; }
.timer-ring { width:64px; height:64px; display:block; }
.timer-bg { fill:none; stroke:#2e1e0a; stroke-width:5; }
.timer-progress { fill:none; stroke:#c8a84b; stroke-width:5; stroke-linecap:round; stroke-dasharray:138.23; stroke-dashoffset:0; transition:stroke-dashoffset .9s linear; transform-origin:32px 32px; transform:rotate(-90deg); }
.timer-overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
.timer-min { font-size:14px; color:#c8a84b; font-weight:bold; line-height:1; }
.timer-sub { font-size:8px; color:#6a5a4a; letter-spacing:1px; margin-top:3px; }
.timer-desc { flex:1; }
.timer-desc-title { font-size:11px; color:#8a7a6a; letter-spacing:1px; margin-bottom:4px; }
.timer-desc-hint  { font-size:11px; color:#5a4a3a; }
.timer-reset-btn { background:transparent; border:1px solid #3a2a1a; color:#6a5a4a; padding:6px 12px; border-radius:3px; cursor:pointer; font-family:inherit; font-size:12px; letter-spacing:1px; transition:all .15s; }
.timer-reset-btn:hover { border-color:#c8a84b; color:#c8a84b; }
.timer-circle.paused .timer-progress { stroke:#6a5a4a; }
.timer-circle.paused .timer-min { color:#6a5a4a; }
.timer-circle.warning .timer-min { color:#e06060; animation:blink 1s ease infinite; }
.timer-circle.done .timer-progress { stroke:#3a2a1a; }
.timer-circle.done .timer-min { color:#4a3a2a; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Result ── */
.result-player { background:#10182a; border:1px solid #3a6090; border-radius:3px; padding:14px 18px; margin-bottom:12px; }
.result-label { font-size:10px; letter-spacing:2px; margin-bottom:8px; color:#5a90c0; }
.result-player-text { font-size:14px; font-weight:bold; color:#d0e0f0; }
.result-consequence { background:#14141e; border-left:2px solid #3a6090; padding:12px 16px; margin-bottom:18px; font-size:13px; line-height:1.75; color:#a0b0c0; }
.divider { border:none; border-top:1px solid #3a3020; margin:16px 0; }
.match-indicator { text-align:center; padding:8px 12px; font-size:13px; margin-bottom:14px; border-radius:3px; letter-spacing:1px; }
.match-indicator.match   { background:#102a1a; color:#50c878; border:1px solid #50c87844; }
.match-indicator.mismatch{ background:#2a1a08; color:#e0a040; border:1px solid #e0a04044; }
.result-history { background:#101e16; border:1px solid #3a7050; border-radius:3px; padding:16px 18px; margin-bottom:18px; }
.result-history.match { border-color:#50c878; }
.result-history-label { font-size:10px; color:#50c878; letter-spacing:2px; margin-bottom:10px; }
.result-history-choice { font-size:14px; font-weight:bold; color:#a0e0b8; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #3a7050; }
.result-history-text { font-size:13px; line-height:1.85; color:#b0c8b8; }
.result-history-text p { margin-bottom:.8em; }
.result-history-text p:last-child { margin-bottom:0; }
.result-history-sub { color:#80a890; font-size:12px; }

/* ── Title ── */
.title-screen { text-align:center; padding:80px 20px 60px; }
.title-kamon  { font-size:40px; margin-bottom:24px; opacity:.6; letter-spacing:8px; }
.title-main   { font-size:30px; line-height:1.4; margin-bottom:6px; letter-spacing:2px; }
.title-sub    { font-size:12px; color:#8a7a6a; letter-spacing:6px; margin-bottom:40px; }
.title-desc   { font-size:13px; color:#907860; line-height:1.9; max-width:480px; margin:0 auto 16px; text-align:left; }
.title-note   { font-size:11px; color:#6a5a4a; margin-bottom:40px; line-height:1.8; }
.start-btn    { background:#c8a84b; border:none; color:#1c1510; padding:14px 52px; font-family:inherit; font-size:15px; cursor:pointer; letter-spacing:5px; border-radius:2px; transition:all .15s; }
.start-btn:hover { background:#e0c060; transform:translateY(-2px); }

/* ── Ending ── */
.ending-section { margin-bottom:26px; }
.ending-section-title { font-size:11px; color:#c8a84b; letter-spacing:3px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid #c8a84b33; }
.narration { background:#1e1410; border:1px solid #2a2018; padding:18px 22px; margin-bottom:16px; line-height:1.95; font-size:15px; }
.narration p { margin-bottom:1em; }
.narration p:last-child { margin-bottom:0; }
.emphasis { color:#e8d0a0; font-weight:bold; }
.score-display { text-align:center; padding:28px; margin-bottom:18px; background:#1e1810; border:1px solid #c8a84b33; border-radius:3px; }
.score-num   { font-size:52px; color:#c8a84b; font-weight:bold; }
.score-denom { font-size:24px; color:#6a5a4a; }
.score-label { font-size:12px; color:#8a7a6a; margin-top:4px; letter-spacing:1px; }
.score-eval  { font-size:13px; color:#a09080; margin-top:10px; line-height:1.7; }
.choice-record { display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid #2a1e10; font-size:13px; }
.choice-record:last-child { border-bottom:none; }
.record-badge { flex-shrink:0; font-size:11px; padding:2px 8px; border-radius:2px; margin-top:2px; }
.record-badge.match   { background:#102a1a; color:#50c878; }
.record-badge.mismatch{ background:#2a1a08; color:#e0a040; }
.record-decision { font-size:11px; color:#6a5a4a; margin-bottom:3px; }
.record-text { color:#c0b0a0; }
.question-box { background:#1e1410; border-left:3px solid #c8a84b; padding:18px 22px; line-height:1.9; font-size:14px; }
.q-item { margin-bottom:14px; padding-left:22px; position:relative; }
.q-item:last-child { margin-bottom:0; }
.q-item::before { content:attr(data-n); position:absolute; left:0; color:#c8a84b; font-weight:bold; }
.restart-btn { display:block; width:100%; background:transparent; border:1px solid #4a3a2a; color:#6a5a4a; padding:12px; font-family:inherit; font-size:13px; cursor:pointer; letter-spacing:3px; border-radius:3px; transition:all .15s; margin-top:20px; margin-bottom:40px; }
.restart-btn:hover { border-color:#c8a84b; color:#c8a84b; }
</style>
</head>

let vn = { lines:[], idx:0, active:false, passageNext:'' };

function startVN(p) {
  vn.lines = p.lines;
  vn.idx = 0;
  vn.active = true;
  vn.passageNext = p.next;
  showVNLine();
  showClickHint();
}

function showVNLine() {
  if (vn.idx >= vn.lines.length) { endVN(); return; }
  const line = vn.lines[vn.idx];
  const spriteEl  = document.getElementById('vnSprite');
  const nameEl    = document.getElementById('vnName');
  const textEl    = document.getElementById('vnText');
  const arrowEl   = document.getElementById('vnArrow');
  const stageEl   = document.getElementById('vnStage');

  // Remove old status overlay
  const oldOv = stageEl ? stageEl.querySelector('.vn-status-overlay') : null;
  if (oldOv) oldOv.remove();

  // ── Status line ──
  if (line.type === 'status') {
    if (spriteEl) { spriteEl.classList.add('out'); }
    if (nameEl) { nameEl.className='vn-name hidden'; }
    if (textEl) { textEl.textContent=''; }
    // Show status as stage overlay
    if (stageEl) {
      const ov = document.createElement('div');
      ov.className = 'vn-status-overlay';
      ov.innerHTML = `<div class="vso-title">${line.title}</div>` +
        line.items.map(i=>`<div class="vso-item">${i}</div>`).join('');
      stageEl.appendChild(ov);
    }
    if (arrowEl) arrowEl.className = 'vn-arrow';
    return;
  }

  // ── Remove status overlay when leaving status ──
  // ── Normal dialogue/narration line ──
  const char = line.speaker ? CHARS[line.speaker] : null;

  // Update sprite
  if (spriteEl) {
    if (char) {
      if (spriteEl.dataset.speaker !== line.speaker) {
        spriteEl.dataset.speaker = line.speaker;
        spriteEl.classList.add('out');
        setTimeout(() => {
          spriteEl.innerHTML = char.svg;
          spriteEl.classList.remove('out');
        }, 200);
      } else {
        spriteEl.classList.remove('out');
      }
    } else {
      spriteEl.classList.add('out');
      spriteEl.dataset.speaker = '';
    }
  }

  // Update speaker name
  if (nameEl) {
    if (char) {
      nameEl.className = 'vn-name';
      nameEl.textContent = char.name;
      nameEl.style.background = char.color;
      nameEl.style.color = '#f0e6d3';
    } else {
      nameEl.className = 'vn-name hidden';
    }
  }

  // Typewriter text
  if (textEl) startTyping(textEl, line.text);
  if (arrowEl) arrowEl.className = 'vn-arrow pause';
}

function advanceVN() {
  if (!vn.active) return;
  if (isTyping()) { skipTyping(); return; }
  // Resume arrow animation
  const arrowEl = document.getElementById('vnArrow');
  if (arrowEl) arrowEl.className = 'vn-arrow';
  vn.idx++;
  showVNLine();
}

function endVN() {
  vn.active = false;
  hideClickHint();
  const btn = document.getElementById('vnNextBtn');
  if (btn) btn.classList.remove('hidden-btn');
  const arrowEl = document.getElementById('vnArrow');
  if (arrowEl) arrowEl.className = 'vn-arrow hidden';
}

// ================================================================
// TYPEWRITER
// ================================================================
const TYPE = { timer:null, el:null, fullHtml:'', plain:'', idx:0 };
const TYPE_SPEED = 38; // ms per char

function startTyping(el, html) {
  clearInterval(TYPE.timer);
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  TYPE.plain = tmp.textContent;
  TYPE.fullHtml = html;
  TYPE.el = el;
  TYPE.idx = 0;
  el.textContent = '';

  TYPE.timer = setInterval(() => {
    TYPE.idx++;
    if (TYPE.idx >= TYPE.plain.length) {
      clearInterval(TYPE.timer);
      TYPE.timer = null;
      el.innerHTML = TYPE.fullHtml;
      const arrowEl = document.getElementById('vnArrow');
      if (arrowEl) arrowEl.className = 'vn-arrow';
    } else {
      el.textContent = TYPE.plain.substring(0, TYPE.idx);
    }
  }, TYPE_SPEED);
}

function skipTyping() {
  if (!TYPE.timer) return;
  clearInterval(TYPE.timer);
  TYPE.timer = null;
  if (TYPE.el) TYPE.el.innerHTML = TYPE.fullHtml;
  const arrowEl = document.getElementById('vnArrow');
  if (arrowEl) arrowEl.className = 'vn-arrow';
}

function isTyping() { return !!TYPE.timer; }

// ================================================================
// TIMER
// ================================================================
const TIMER_TOTAL = 180;
const CIRC = 2 * Math.PI * 22; // ≈138.23
let timerState = { remaining:TIMER_TOTAL, paused:false, id:null };

function startTimer() {
  clearInterval(timerState.id);
  timerState.remaining = TIMER_TOTAL;
  timerState.paused = false;
  timerState.id = setInterval(() => {
    if (timerState.paused) return;
    timerState.remaining = Math.max(0, timerState.remaining - 1);
    renderTimer();
    if (timerState.remaining === 0) {
      clearInterval(timerState.id);
      const el = document.getElementById('timerCircle');
      if (el) el.classList.add('done');
    }
  }, 1000);
  renderTimer();
}
function stopTimer() { clearInterval(timerState.id); timerState.id = null; }
function toggleTimerPause() { timerState.paused = !timerState.paused; const el=document.getElementById('timerCircle'); if(el) el.classList.toggle('paused',timerState.paused); }
function resetTimerBtn(e) { if(e) e.stopPropagation(); stopTimer(); startTimer(); }
function renderTimer() {
  const el = document.getElementById('timerCircle'); if(!el) return;
  const m = Math.floor(timerState.remaining/60), s = timerState.remaining%60;
  const t = el.querySelector('.timer-min'); if(t) t.textContent = `${m}:${s.toString().padStart(2,'0')}`;
  const ring = el.querySelector('.timer-progress'); if(ring) ring.style.strokeDashoffset = CIRC*(1-timerState.remaining/TIMER_TOTAL);
  el.classList.toggle('warning', timerState.remaining>0 && timerState.remaining<=30);
}

// ================================================================
// FULLSCREEN
// ================================================================
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

// ================================================================
// CLICK HINT
// ================================================================
function showClickHint() { document.getElementById('clickHint').classList.add('show'); }
function hideClickHint() { document.getElementById('clickHint').classList.remove('show'); }

// ================================================================
// KEYBOARD + CLICK
// ================================================================
document.addEventListener('click', e => {
  if (e.target.closest('button, a')) return;
  if (vn.active) advanceVN();
});

document.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && vn.active) { e.preventDefault(); advanceVN(); return; }
  const p = P[S.passage];
  if (p && p.type === 'decision' && !S.showResult) {
    const map = {a:0,A:0,'1':0,b:1,B:1,'2':1,c:2,C:2,'3':2};
    if (e.key in map && map[e.key] < p.choices.length) choose(map[e.key]);
  }
});

// ================================================================
// RENDER
// ================================================================
function triggerAnim() {
  const app = document.getElementById('app');
  app.classList.remove('page-enter');
  void app.offsetWidth;
  app.classList.add('page-enter');
}

function render() {
  stopTimer();
  hideClickHint();
  clearInterval(TYPE.timer); TYPE.timer = null;
  vn.active = false;
  const app = document.getElementById('app');
  const id = S.passage;

  if (id === 'title')  { app.innerHTML = renderTitle();  triggerAnim(); return; }
  if (id === 'ending') { app.innerHTML = renderEnding(); triggerAnim(); window.scrollTo(0,0); return; }

  const p = P[id];
  if (!p) return;

  if (p.type === 'story') {
    app.innerHTML = renderStory(p);
    triggerAnim();
    window.scrollTo(0,0);
    startVN(p);
  }
  if (p.type === 'decision') {
    app.innerHTML = S.showResult ? renderResult(p) : renderDecision(p);
    triggerAnim();
    window.scrollTo(0,0);
    if (!S.showResult) {
      startTimer();
      setTimeout(() => {
        document.querySelectorAll('.choice-btn').forEach((btn,i) => {
          setTimeout(() => btn.classList.add('in'), i*160);
        });
      }, 100);
    }
  }
}

function header(tl) {
  const items = TL.map((t,i) => {
    const cls = i<tl?'past':i===tl?'active':'';
    return `<div class="tl-item ${cls}">${t.replace('\n','<br>')}</div>`;
  }).join('');
  return `<div class="game-header"><div class="game-label">歴史シミュレーション</div></div><div class="timeline">${items}</div>`;
}

function renderTitle() {
  return `<div class="title-screen">
<div class="title-kamon">⚜ ⚜ ⚜</div>
<div class="title-main">桂太郎と<br>日露戦争の選択</div>
<div class="title-sub">1901 ─── 1905</div>
<div class="title-desc">
あなたは内閣総理大臣・桂太郎として、明治期最大の国家的危機に臨む。<br>
ロシアとの戦争をめぐる4つの決断を、実際の歴史的制約の中で体験しよう。<br><br>
まず自分で選択し、そのあとで桂が実際にどう判断したか──その理由とともに明らかになる。
</div>
<div class="title-note">
【学習のポイント】 正解は「桂が選んだ選択肢」ではない。なぜその選択が当時の状況で合理的に見えたかを考えることが目的。<br>
<span style="color:#4a3a2a">クリック / スペース で台詞を送る　　A B C で選択　　F で全画面</span>
</div>
<button class="start-btn" onclick="gotoPassage('intro')">は じ め る</button>
</div>`;
}

function renderStory(p) {
  return `${header(p.tl)}
<div class="scene-header"><div class="scene-year">${p.year}</div><div class="scene-title">${p.title}</div></div>
<div class="vn-scene">
  <div class="vn-stage" id="vnStage">
    <div class="vn-sprite out" id="vnSprite"></div>
  </div>
  <div class="vn-box">
    <div class="vn-name hidden" id="vnName"></div>
    <div class="vn-text" id="vnText"></div>
    <div class="vn-arrow" id="vnArrow">▼</div>
  </div>
</div>
<button class="continue-btn hidden-btn" id="vnNextBtn" onclick="gotoPassage('${p.next}')">次の局面へ →</button>`;
}

function renderDecision(p) {
  const ch = p.choices.map((c,i)=>
    `<button class="choice-btn" data-label="${c.label}" onclick="choose(${i})">${c.text}</button>`
  ).join('');
  const kbLabels = p.choices.map(c=>c.label).join(' / ');
  return `${header(p.tl)}
<div class="scene-header"><div class="scene-year">${p.year}</div><div class="scene-title">${p.title}</div></div>
<div class="decision-tag">${p.tag}</div>
<div class="decision-context">${p.context}</div>
<div class="timer-area">
  <div class="timer-circle" id="timerCircle" onclick="toggleTimerPause()" title="クリックで一時停止">
    <svg class="timer-ring" viewBox="0 0 64 64"><circle class="timer-bg" cx="32" cy="32" r="22"/><circle class="timer-progress" cx="32" cy="32" r="22"/></svg>
    <div class="timer-overlay"><div class="timer-min">3:00</div><div class="timer-sub">審議</div></div>
  </div>
  <div class="timer-desc"><div class="timer-desc-title">グループ審議タイマー（3分）</div><div class="timer-desc-hint">クリックで一時停止</div></div>
  <button class="timer-reset-btn" onclick="resetTimerBtn(event)">↺ リセット</button>
</div>
<div class="choices">${ch}</div>
<div class="keyboard-hint">キーボード ${kbLabels} で選択可</div>`;
}

function renderResult(p) {
  const c = S.pendingChoice, isM = c.isH;
  const hist = p.choices.find(x=>x.isH);
  const matchHtml = isM
    ? `<div class="match-indicator match">✓ 桂太郎と同じ選択をしました</div>`
    : `<div class="match-indicator mismatch">△ 桂太郎の選択とは異なります</div>`;
  return `${header(p.tl)}
<div class="scene-header"><div class="scene-year">${p.year}</div><div class="scene-title">${p.tag}：あなたの選択</div></div>
<div class="result-player"><div class="result-label">▷ あなたの選択</div><div class="result-player-text">「${c.text}」</div></div>
<div class="result-consequence">${c.pc}</div>
<hr class="divider">${matchHtml}
<div class="result-history ${isM?'match':''}">
  <div class="result-history-label">🔍 ${isM?'桂太郎の判断（あなたと同じ選択）':'桂太郎が実際に選んだこと'}</div>
  <div class="result-history-choice">「${hist.text}」</div>
  <div class="result-history-text">${c.ht}</div>
</div>
<button class="continue-btn" onclick="next()">次の局面へ →</button>`;
}

function renderEnding() {
  const m = S.matches;
  const evals = [
    'ほとんどの局面で桂太郎と異なる判断をした。現代の価値観が影響したかもしれない。どこで判断が分かれたか確認しよう。',
    '多くの局面で桂太郎と異なる判断をした。当時の制約（財政・元老・国際関係）がどう判断を縛っていたか振り返ってみよう。',
    '半数の局面で桂太郎と同じ判断をした。どこで判断が分かれたか、その理由を考えてみよう。',
    'おおむね桂太郎の判断と一致した。当時の制約の中での合理性をよく理解している。',
    '桂太郎の論理を完全に追体験した。当時の情報環境・制約の中での判断の在り方を深く理解している。'
  ];
  const logHtml = S.log.map(r=>`
<div class="choice-record">
  <span class="record-badge ${r.isH?'match':'mismatch'}">${r.isH?'一致':'相違'}</span>
  <div><div class="record-decision">${r.dec}</div><div class="record-text">${r.text}</div></div>
</div>`).join('');

  return `${header(5)}
<div class="scene-header"><div class="scene-year">1905年9月5日</div><div class="scene-title">ポーツマス条約、そして日比谷焼き討ち事件</div></div>
<div class="narration">
<p>条約調印のその日、東京・日比谷では凄まじい暴動が起きた。政府系新聞社・交番が次々と焼かれ、死者も出た。<span class="emphasis">日比谷焼き討ち事件</span>である。</p>
<p>民衆の怒りは一点に集中していた──「<span class="emphasis">勝ったのに、なぜ賠償金がないのか</span>」。桂は戒厳令を布告し、第1次桂内閣はその直後に総辞職した。</p>
</div>
<div class="ending-section"><div class="ending-section-title">▍ なぜこうなったのか</div>
<div class="narration">
<p>桂太郎が「財政的に限界」という事実を国民に伝えることができなかったからである。それを伝えれば──ロシアの継戦派が勢いづく。外債市場が崩壊する。元老・政界の説得が不可能になる。</p>
<p>桂は多くの制約の中で当時として合理的な判断を下し続けた。しかし国民はその事情を知らなかった。「勝利」だけを伝えられ続けた国民は、「負けていないのに賠償金なし」という結果に激怒した。情報が遮断された近代国家の、一つの帰結だった。</p>
</div></div>
<div class="ending-section"><div class="ending-section-title">▍ あなたの選択の記録</div>
<div class="score-display">
  <div><span class="score-num">${m}</span><span class="score-denom"> / 4</span></div>
  <div class="score-label">桂太郎と同じ選択をした決断数</div>
  <div class="score-eval">${evals[Math.min(m,4)]}</div>
</div>${logHtml}</div>
<div class="ending-section"><div class="ending-section-title">▍ 考察のための問い</div>
<div class="question-box">
<div class="q-item" data-n="①">桂太郎の各選択は「合理的」だったか？何を根拠に、誰の視点から評価するか。</div>
<div class="q-item" data-n="②">政府が国民に真実を言えないとき、何が起きるか。現代の事例と比較して考えよう。</div>
<div class="q-item" data-n="③">「勝利」とは何か。日露戦争の結果を、日本・ロシア・朝鮮・国際社会それぞれの視点から評価してみよう。</div>
<div class="q-item" data-n="④">あなたが桂と違う選択をした局面はどこか。その選択はなぜ当時の状況では難しかったのか。</div>
</div></div>
<button class="restart-btn" onclick="restart()">もう一度プレイする</button>`;
}

// ================================================================
// GAME LOGIC
// ================================================================
function gotoPassage(id) { S.passage=id; S.showResult=false; render(); }
function choose(i) {
  const p=P[S.passage], c=p.choices[i];
  S.pendingChoice=c; S.showResult=true;
  if(c.isH) S.matches++;
  S.log.push({dec:p.tag+' '+p.title, text:c.text, isH:c.isH});
  stopTimer(); render();
}
function next() { S.passage=S.pendingChoice.next; S.showResult=false; S.pendingChoice=null; render(); }
function restart() { S={passage:'title',showResult:false,pendingChoice:null,matches:0,log:[]}; render(); }

render();
</script>
</body>
</html>
