name: Deploy History Simulation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '歴史シミュレーションv2_public/**'
      - '.github/workflows/deploy-history-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: 歴史シミュレーションv2_public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4