# テスト問題作成 設定ファイル
# generate.py が参照する設定。必要に応じて編集してください。

exam:
  subject: "日本史"          # 科目名（日本史 / 公共 / 探究）
  grade: "2年"              # 学年
  unit: "前期中間"  # 単元名（空欄でも可）
  exam_date: ""             # 実施予定日（例: 2026-06-15）

questions:
  total: 20                  # 問題数合計
  points_per_question: 2     # 1問の配点
  primary_source: 6          # 一次史料（枠囲み文字資料）問題数（全体の30%）
  textbook_question: 8       # 教科書「問い」を使った問題数（全体の40%）
  timeline_order: 2          # 年代整序問題数
  other: 4                   # Web資料・概念問題等（全体の20%、うち1問以上はWeb資料）

difficulty:
  easy: 0         # 易（使用しない）
  standard: 20    # 標準（%）
  hard: 80        # 難（%）

output:
  filename: "テスト_{subject}_{unit}.docx"   # 出力ファイル名テンプレート
  include_answer_sheet: true               # 解答・解説シートを別シートで出力
  include_scoring_rubric: true             # 採点基準を付ける（論述のみ）

sources:
  # input/ 以下のどのフォルダを優先的に参照するか
  use_past_exams: false       # past_exams/ の過去問を参照
  use_textbook_images: false  # textbook_images/ の画像を参照
  use_worksheets: false       # worksheets/ のプリントを参照

  # このフォルダ直下の資料フォルダ（絶対パスで指定）
  external:
    past_exams: []  # 今回は教科書のみ使用
    textbooks:
      - "C:\\Users\\kengo\\OneDrive\\デスクトップ\\claude開発\\テスト問題作成\\教科書\\教科書 JPEG　前期中間２"
    worksheets: []  # 今回は教科書のみ使用

instructions: |
  - 問題文は高校生が読む試験問題として完結した自然な日本語で書く
  - 過去問の文体に準じること。「教科書分析テキスト」「分析テキストによれば」など試験問題として不自然な表現は絶対に使わない
  - 論述問題・語句記述問題は作らない。4択・年代整序のみ使用する
  - 選択問題は4択以上。2択は不可
  - 難易度は「標準20%・難しい80%」で構成し、易しい問題は作らない
  - 概念的知識を問う選択肢の長さは30字程度を標準とする
  - 【構成比率】一次史料問題30%・教科書「問い」問題40%・年代整序2問・Web資料/概念問題等20%
  - 【一次史料問題】枠囲み番号付き資料（例：資料6「キャラコ禁止法」）の本文を問題文に引用して出題する
  - 【問い問題】教科書の「問い」をそのまままたは4択化して出題する
  - Web上で教科書の概念を問える史料・グラフ・画像を検索し、それを使った問題を1問以上作る。解説欄にURL・出典を明記する
  - 全問題の問題文・選択肢・正答が互いに被らないよう、生成後に確認・修正する
  - 【セルフチェック①】問題文・選択肢が自然な日本語として成立しているか確認し、破綻があれば書き直す
  - 【セルフチェック②】正答の根拠が教科書の内容から取れるか確認し、根拠がなければ修正する
  - 【セルフチェック③】問題文に不自然な表現がないか確認し、あれば削除・書き直す
